<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without color-scheme the browser keeps drawing its own furniture light: the
     native <select> popup, the scrollbars and the range track all came out
     white-on-dark. The meta below matches the browser chrome to the page. -->
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<title>BMW CarData — track</title>
<meta name="description" content="Recorded BMW CarData telemetry: drives on a map coloured by drivetrain, trip breakdown, and live vehicle readings. Self-hosted, from your own car's stream.">
<meta property="og:type" content="website">
<meta property="og:title" content="BMW CarData — your drives on a map">
<meta property="og:description" content="Drives coloured by battery, petrol or recuperation, with a trip breakdown and live readings. Self-hosted BMW CarData telemetry.">
<meta property="og:image" content="https://peterkoczan.github.io/bmw-cardata/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Inline, because the page is opened straight off disk: a favicon.ico sibling
     would 404 on file:// and leave the generic blank-document icon. Our own
     quartered roundel, deliberately not BMW's -- this repository is public and
     theirs is a registered trademark. -->
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230f1115'/%3E%3Cpath d='M32 4a28 28 0 0 1 28 28H32z' fill='%233b82f6'/%3E%3Cpath d='M32 32h28a28 28 0 0 1-28 28z' fill='%23e6e9ef'/%3E%3Cpath d='M32 32v28A28 28 0 0 1 4 32z' fill='%233b82f6'/%3E%3Cpath d='M4 32A28 28 0 0 1 32 4v28z' fill='%23e6e9ef'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%230f1115' stroke-width='5'/%3E%3C/svg%3E">
<!-- Pinned by hash, not just by version. A substituted script here would run on
     the http://127.0.0.1:8770 origin, where fetch('data.json') already succeeds:
     every GPS fix and both VINs are readable from it. With integrity set the
     browser refuses to execute anything whose bytes do not match. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --muted: #99a1b3; --tile: #1d212a;
    --accent: #3b82f6; --focus: #7aa2f7;
    /* Status is reserved -- never reused as a series colour. */
    --warn: #f59e0b; --crit: #f87171; --good: #34d399;
    /* Borders and shadows tinted towards the background hue rather than pure
       black, so edges read as depth instead of as a drawn line. */
    --shadow: 0 1px 2px #05070c66, 0 8px 24px #05070c4d;
  }
  /* Light tokens, applied two ways: when the system asks for light and the page
     has not been told otherwise, and when the page has been told light outright.
     The two selectors cannot be merged into one rule -- a media query cannot sit
     in a selector list -- so the block is written twice on purpose. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f5f6f8; --panel:#fff; --line:#dfe3ea; --text:#12151b; --muted:#5b6474; --tile:#f2f4f7;
      --accent:#2563eb; --focus:#1d4ed8;
      --warn:#b45309; --crit:#b91c1c; --good:#047857;
      --shadow: 0 1px 2px #64748b26, 0 8px 24px #64748b1f; }
  }
  :root[data-theme="light"] {
    --bg:#f5f6f8; --panel:#fff; --line:#dfe3ea; --text:#12151b; --muted:#5b6474; --tile:#f2f4f7;
    --accent:#2563eb; --focus:#1d4ed8;
    --warn:#b45309; --crit:#b91c1c; --good:#047857;
    --shadow: 0 1px 2px #64748b26, 0 8px 24px #64748b1f; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  @media (prefers-color-scheme: light) { html:not([data-theme="dark"]) { color-scheme: light; } }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  /* One designed focus ring everywhere, rather than the browser's. The default
     was visible -- checked with a real Tab, not a programmatic focus() -- but it
     is the UA's orange and sits tight against the control. */
  :where(button, select, input, a, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 6px;
  }
  /* Screen-reader-only: an accessible name where the visual is an icon. */
  .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  /* Flex column rather than an absolutely-positioned bar of a fixed height. The
     bar's contents vary with how many cars there are and how many trips they
     made, and at 300px the controls alone could eat all of it -- leaving the
     dashboard 24px tall to show 1400px of tiles. */
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  #map { flex:1 1 auto; min-height:120px; background:var(--bg); }
  .leaflet-container { background: var(--bg); }

  /* Ambient plus direct, tinted towards the background hue: the bar reads as
     sitting above the map rather than as a line drawn across it. */
  #bar { flex:0 0 auto; max-height:55vh; overflow:hidden; background:var(--panel);
    border-top:1px solid var(--line); display:flex; flex-direction:column;
    box-shadow:var(--shadow); z-index:500; }
  /* Natural height, capped -- not proportionally shrinkable. Left shrinkable,
     flex weighs the dashboard's ~1500px of tiles against these ~130px and
     squeezes the controls to a sliver while the dashboard keeps hundreds of
     pixels it does not need. Past the cap the controls scroll instead. */
  .controls { flex:0 0 auto; max-height:46vh; overflow-y:auto; padding:10px 16px 8px;
    display:flex; flex-direction:column; gap:7px; border-bottom:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #clock { font-variant-numeric:tabular-nums; font-weight:600; min-width:185px; }
  /* 24px of hit target for a 6px track: the element was 16px tall, under the
     24px minimum, so grabbing the scrubber took aim. */
  input[type=range] { flex:1; min-width:200px; accent-color:var(--accent);
    height:24px; touch-action:manipulation; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px;
    padding:7px 12px; cursor:pointer; font-size:13px; min-height:30px;
    touch-action:manipulation;
    transition:background-color .12s ease, color .12s ease; }
  /* Contrast rises on each step towards commitment, rather than the whole
     button dimming and brightening. */
  button:hover { background:color-mix(in oklab, var(--line) 70%, var(--text)); }
  button:active { background:color-mix(in oklab, var(--line) 55%, var(--text)); }
  button.on { background:var(--accent); color:#fff; }
  button.on:hover { background:color-mix(in oklab, var(--accent) 85%, #fff); }
  .legend { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .sw { display:inline-block; width:22px; height:8px; border-radius:2px;
    vertical-align:middle; margin-right:5px; }
  .sw.dot { width:9px; height:9px; border-radius:50%; background:var(--muted);
    border:1.5px solid var(--panel); box-shadow:0 0 0 1px var(--muted); }
  .note { flex:0 0 auto; color:var(--muted); font-size:11.5px; padding:0 16px 6px; }

  /* One line that scrolls, however many cars or trips there are. Wrapping these
     instead would push the dashboard off the bottom of the window. */
  #vehicles { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin;
    padding-bottom:2px; }
  #vehicles > * { flex:0 0 auto; }
  #vehicles button { font-weight:600; }
  #vehicles button .sub { font-weight:400; opacity:.72; margin-left:7px;
    font-variant-numeric:tabular-nums; }
  /* Renamed here rather than in config: marked so a name that disagrees with
     what the rest of the tooling calls the car is not a silent mystery. */
  #vehicles button.renamed .name::after { content:'*'; opacity:.55; margin-left:2px; }
  /* A real input, swapped in for the button while editing. Nesting a
     contenteditable inside the <button> looks tidier and does not work: the
     button claims Enter as its own activation and the edit never commits. */
  input.rename { flex:0 0 auto; background:var(--bg); color:var(--text);
    border:1px solid var(--accent); border-radius:6px; padding:6px 10px; font:inherit;
    font-weight:600; font-size:13px; min-width:90px; }

  /* The row's own caption. Outside the scroller, so it stays put when there are
     more cars than fit. */
  .vehrow { align-items:center; gap:10px; }
  .rowlabel { flex:0 0 auto; color:var(--muted); font-size:12px; }

  /* Date and trip pickers. Dropdowns rather than a row of buttons: a month of
     retention is dozens of trips, and that row was already scrolling sideways
     with one day's worth. */
  .pickers { gap:8px 14px; }
  /* Label and its dropdown wrap as one unit -- split, the caption ends up
     stranded at the end of the line above its own control. */
  .picker { display:inline-flex; align-items:center; gap:7px; min-width:0;
    flex:0 1 auto; }
  .pickers select { flex:0 1 auto; min-width:0; background:var(--tile);
    color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; font:inherit; font-size:13px; cursor:pointer; }
  .pickers select:disabled { opacity:.5; cursor:default; }
  .pickers label { cursor:pointer; }
  #focusnote { font-variant-numeric:tabular-nums; }

  /* The counterpart to the live badge: shown on a saved copy, which changes
     only when somebody re-runs the exporter and otherwise sits there looking
     exactly like a working page. */
  #snapshot { background:#f59e0b1a; border:1px solid #f59e0b55; border-radius:7px;
    padding:6px 10px; font-size:12.5px; gap:8px; }
  #snapshot a { color:#7aa2f7; }
  #snapshot[hidden] { display:none; }

  /* The at-a-glance strip, filling the gap that used to sit empty between the
     focus note and the live dot. Always the newest reading, never the scrub
     position -- the dashboard below already follows the slider, and the
     question this answers is "what is the car doing now". */
  #now { margin-left:auto; display:inline-flex; align-items:center; gap:14px;
    font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #now[hidden] { display:none; }
  #now .grp { display:inline-flex; align-items:baseline; gap:6px; }
  #now .ico { font-size:13px; opacity:.85; }
  #now .pct { font-weight:600; font-size:14px; }
  #now .rng { color:var(--muted); }
  /* Below a quarter left, the number is the point of the strip. Colour alone
     would say nothing to a colourblind reader or in a forced-colours mode, so
     the level also gets a word -- the same reason the route legend is labelled
     rather than left as swatches. */
  #now .grp.low .pct { color:var(--warn); }
  #now .grp.empty .pct { color:var(--crit); }
  #now .lvl { font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:1px 5px; border-radius:4px; }
  /* How old the whole strip is. Amber once the car has been quiet an hour, so a
     stale reading cannot pass for a current one. */
  #now .age { color:var(--muted); font-size:11.5px; padding-left:2px;
    border-left:1px solid var(--line); }
  #now .age.stale { color:var(--warn); }
  #now .grp.low .lvl { color:var(--warn); border:1px solid color-mix(in oklab, var(--warn) 45%, transparent); }
  #now .grp.empty .lvl { color:var(--crit); border:1px solid color-mix(in oklab, var(--crit) 45%, transparent); }

  /* Square, so the glyph is centred and the target stays ≥24px either way. */
  .iconbtn { min-width:30px; padding:6px 8px; font-size:14px; line-height:1;
    background:transparent; color:var(--muted); }
  .iconbtn:hover { color:var(--text); background:var(--line); }

  /* Shown only when the page is served, not when it is opened off disk -- a
     "live" badge on a static snapshot would be a lie. */
  #live { display:inline-flex; align-items:center; gap:6px; }
  /* An author `display` beats the UA stylesheet's [hidden] { display:none },
     so setting .hidden on this element does nothing without saying so here.
     The property reads true while the badge sits there in plain sight. */
  #live[hidden] { display:none; }
  #live i { width:8px; height:8px; border-radius:50%; background:#22c55e;
    box-shadow:0 0 0 0 #22c55e99; }
  #live.stale i { background:var(--muted); box-shadow:none; }
  #live.pulse i { animation:livepulse 1.1s ease-out 2; }
  @keyframes livepulse {
    0%   { box-shadow:0 0 0 0 #22c55eaa; transform:scale(1); }
    60%  { box-shadow:0 0 0 7px #22c55e00; transform:scale(1.35); }
    100% { box-shadow:0 0 0 0 #22c55e00; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #live.pulse i { animation:none; }
  }

  #state { flex:1 1 auto; min-height:90px; overflow-y:auto; padding:10px 16px 14px; }
  .group { margin-bottom:12px; }
  .group h4 { margin:0 0 6px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); font-weight:600; }
  .tiles { display:grid; gap:7px; grid-template-columns:repeat(auto-fill, minmax(178px, 1fr)); }
  .tile { background:var(--tile); border-radius:7px; padding:7px 10px; min-width:0; }
  .tile .k { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .tile .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.stale .v { color:var(--muted); font-weight:400; }
  /* The handful you actually open the page for. */
  .tile.primary { background:linear-gradient(180deg,var(--tile),var(--tile));
    border:1px solid color-mix(in oklab, var(--accent) 34%, transparent);
    box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 10%, transparent); }
  .tile.primary .v { font-size:21px; letter-spacing:-.01em; }
  .tile.primary .k { color:var(--focus); }

  #hover { position:absolute; z-index:1000; pointer-events:none; display:none;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; min-width:190px; box-shadow:0 6px 22px rgba(0,0,0,.35);
    font-size:12.5px; }
  #hover .h { font-weight:600; margin-bottom:5px; font-variant-numeric:tabular-nums; }
  #hover dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  #hover dt { color:var(--muted); white-space:nowrap; }
  #hover dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  #hover .mode { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:5px; vertical-align:baseline; }
</style>
</head>
<body>
<!-- The page went straight to <h4> group headings with nothing above them, so
     the document had no top level to navigate from. Visually hidden because the
     page has no room for a banner and the title bar already says it. -->
<h1 class="sr">BMW CarData — recorded drives</h1>
<div id="map" role="application" aria-label="Route map"></div>
<!-- Mouse-only affordance; everything in it is also in the dashboard below, so
     it is not announced. -->
<div id="hover" aria-hidden="true"></div>
<!-- One polite region for things worth interrupting for: new data arriving. -->
<div id="announce" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="bar">
  <div class="controls">
    <div class="row" id="snapshot" hidden>
      <span id="snapshot-text"></span>
      <a id="snapshot-link" href="#">Open the live map →</a>
    </div>
    <div class="row vehrow">
      <span class="rowlabel">Vehicles</span>
      <span class="row" id="vehicles"></span>
    </div>
    <div class="row pickers">
      <span class="picker"><label class="rowlabel" for="datesel">Date</label>
        <select id="datesel"></select></span>
      <span class="picker"><label class="rowlabel" for="tripsel">Trip</label>
        <select id="tripsel"></select></span>
      <button id="clearfocus" hidden>Show all</button>
      <span class="rowlabel" id="focusnote"></span>
      <span id="now" hidden></span>
      <span id="live" class="rowlabel" hidden title="Watching for new data">
        <i></i>live</span>
      <button id="theme" class="iconbtn" title="Theme: follows your system"
              aria-label="Change theme">◐</button>
    </div>
    <div class="row">
      <button id="play" aria-label="Play the route back">▶︎ Play</button>
      <!-- Deliberately not a live region: it ticks on every frame of playback,
           and announcing each one would be a firehose. New *data* is announced
           instead, once, from #announce below. -->
      <span id="clock">—</span>
      <input type="range" id="slider" min="0" max="0" value="0" step="1"
             aria-label="Scrub through the recorded history">
      <button id="end" aria-label="Jump to the most recent reading">Latest</button>
    </div>
    <div class="row legend" id="legend">
      <span data-mode="electric"><i class="sw" style="background:linear-gradient(90deg,#60a5fa,#2563eb)"></i>electric</span>
      <span data-mode="petrol"><i class="sw" style="background:linear-gradient(90deg,#f87171,#dc2626)"></i>petrol</span>
      <span data-mode="regen"><i class="sw" style="background:linear-gradient(90deg,#2dd4bf,#0d9488)"></i>recuperating</span>
      <span data-mode="unknown"><i class="sw" style="background:#8b94a7"></i>unknown</span>
      <span><i class="sw dot"></i>received fix</span>
    </div>
  </div>
  <div id="state"></div>
  <div class="note" id="notes"></div>
</div>
<script>
let DATA = /*__DATA__*/null;

/* ---------- route colouring ---------- */
// Validated with the dataviz palette checker, both surfaces, all pairs.
//
// Green was the obvious colour for recuperation and it was the wrong one: red
// #b91c1c against green #15803d separates by ΔE 4.2 under deuteranopia, where
// the floor is 6 and the target 8. Since hue is the *only* thing encoding
// drivetrain mode on the map, a red-green colourblind reader -- about 8% of men
// -- lost the feature entirely. Teal clears it at 13.1.
//
// The pale ends matter just as much and were worse: the old tints separated by
// ΔE 3.6 under deuteranopia and 9.8 under *normal* vision, against a floor of
// 15, at 1.2:1 contrast. Spending lightness on intensity while hue carries
// identity means a low-intensity segment converges towards white and stops
// saying anything at all. The ramps are narrower now so both ends keep their
// hue: 10.7 CVD, 17.8 normal.
const RAMPS = {
  electric:['#60a5fa','#2563eb'], petrol:['#f87171','#dc2626'], regen:['#2dd4bf','#0d9488'],
  unknown:['#8b94a7','#8b94a7'], idle:['#8b94a7','#8b94a7'], start:['#8b94a7','#8b94a7'],
};
const mix = (a,b,t) => {
  const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const [ar,ag,ab]=p(a), [br,bg,bb]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return `#${c(ar,br)}${c(ag,bg)}${c(ab,bb)}`;
};
const colourFor = pt => {
  const [lo,hi] = RAMPS[pt.mode] || RAMPS.unknown;
  return mix(lo, hi, Math.max(0, Math.min(1, pt.intensity ?? 0)));
};

// How the route is drawn either side of the scrub position. The part not yet
// reached has to stay clearly secondary without disappearing: it used to be
// drawn at 0.12, which reads fine zoomed out over a town and vanishes into the
// basemap zoomed into a long motorway run, where a single segment is a straight
// line the width of the screen sitting directly on top of the road it followed.
// Raised, and given a thinner line and smaller dots as well, so the difference
// survives even where the colours do not.
const PAST  = { line: .9,  weight: 5, dotStroke: .9,  dotFill: 1,   radius: 3.5 };
const AHEAD = { line: .45, weight: 3, dotStroke: .65, dotFill: .5,  radius: 2.8 };

/* ---------- value formatting ---------- */
const GROUPS = {
  drivetrain:'Drivetrain', powertrain:'Powertrain', chassis:'Chassis',
  cabin:'Cabin', body:'Body', vehicle:'Vehicle', trip:'Trip',
};
// The at-a-glance set, in the order you actually want to read them: how much
// is left, how far that goes, then the odometer and what the car is doing.
// BMW's own names are right for the long tail but wordy here -- "Charging
// status of high-voltage battery" sitting next to "Charging status" is worse
// than useless -- so these few get short ones.
const PRIORITY = [
  ['vehicle.drivetrain.batteryManagement.header', 'Charge'],
  ['vehicle.drivetrain.electricEngine.kombiRemainingElectricRange', 'Electric range'],
  ['vehicle.drivetrain.fuelSystem.level', 'Fuel'],
  ['vehicle.vehicle.travelledDistance', 'Odometer'],
  ['vehicle.drivetrain.lastRemainingRange', 'Total range'],
  ['vehicle.drivetrain.fuelSystem.remainingFuel', 'Fuel in tank'],
  ['vehicle.drivetrain.electricEngine.charging.status', 'Charging'],
  ['vehicle.powertrain.electric.battery.charging.power', 'Charging at'],
  ['vehicle.body.chargingPort.status', 'Charging plug'],
  ['vehicle.drivetrain.electricEngine.charging.timeToFullyCharged', 'Full in'],
  ['vehicle.cabin.door.status', 'Doors'],
  ['vehicle.drivetrain.engine.isIgnitionOn', 'Ignition'],
  ['vehicle.isMoving', 'Moving'],
];
const SHORT_LABELS = Object.fromEntries(PRIORITY);
// Readings that only mean anything on a car that burns something. A BEV reports
// these as a flat zero, so promoting them puts "Fuel in tank 0 l" and "Total
// range 0 km" next to a perfectly good electric range. They still appear under
// their own category further down -- demoted, not hidden.
const FUEL_ONLY = new Set([
  'vehicle.drivetrain.fuelSystem.level',
  'vehicle.drivetrain.fuelSystem.remainingFuel',
  'vehicle.drivetrain.lastRemainingRange',
]);
const priorityFor = v =>
  PRIORITY.map(([k]) => k).filter(k => v?.burns_fuel !== false || !FUEL_ONLY.has(k));
// The first few get the large treatment -- these are the ones anyone opening
// the page is actually looking for.
const PRIMARY_COUNT = 4;

// A bare "No" against "Status of charging flap" is technically true and tells
// you nothing. Say what the state is instead, taken from the predicate the key
// itself names.
const BOOL_WORDS = [
  [/isLocked$/i,            ['Unlocked', 'Locked']],
  [/isPermanentlyUnlocked$/i, ['Normal', 'Permanently unlocked']],
  [/isHospitalityActive$/i, ['Locks after charging', 'Stays unlocked']],
  [/isOpen$/i,              ['Closed', 'Open']],
  [/isActive$/i,            ['Inactive', 'Active']],
  [/isPlugged$/i,           ['Unplugged', 'Plugged in']],
  [/isMoving$/i,            ['Stationary', 'Moving']],
  [/isIgnitionOn$/i,        ['Off', 'On']],
  [/isRemoteEngineRunning$/i, ['Not running', 'Running']],
  [/Connected$/i,           ['Disconnected', 'Connected']],
  [/isOn$/i,                ['Off', 'On']],
];

// BMW's enums arrive unspaced and shouting.
const ENUM_WORDS = {
  CHARGINGACTIVE: 'Active', CHARGINGPAUSED: 'Paused',
  CHARGINGENDED: 'Finished', CHARGINGERROR: 'Error',
  NOCHARGING: 'Not charging', INITIALIZATION: 'Starting',
  NOT_CHARGING: 'Not charging', WAITING_FOR_CHARGING: 'Waiting',
  FINISHED_FULLY_CHARGED: 'Fully charged', FINISHED_NOT_FULL: 'Finished',
  CONNECTED: 'Connected', DISCONNECTED: 'Disconnected',
  SECURED: 'Locked', UNLOCKED: 'Unlocked', 'SELECTIVE-LOCKED': 'Partly locked',
  SELECTIVELOCKED: 'Partly locked', CLOSED: 'Closed', OPEN: 'Open',
  INTERMEDIATE: 'Partly open', OPEN_TILT: 'Tilted', INTERMEDIATE_TILT: 'Tilted',
  INVALID: '—', UNKNOWN: '—', AUTOMATIC: 'Automatic',
  // Plug and connector names the generic sentence-case mangles.
  AC_TYPE2PLUG: 'AC Type 2', AC_TYPE1PLUG: 'AC Type 1',
  DC_CCSPLUG: 'DC CCS', DC_CHADEMOPLUG: 'DC CHAdeMO',
  AC_HOUSEHOLDPLUG: 'AC household socket',
  CONDUCTIVE: 'Conductive', INDUCTIVE: 'Inductive',
};

// BMW ships display names and categories in its catalogue; prefer those over
// anything derived from the key path. The fallback only applies when the
// catalogue has not been fetched.
let LABELS = DATA?.labels || {};
const labelFor = key => SHORT_LABELS[key] || LABELS[key]?.n || key.split('.').filter(p => p !== 'vehicle')
  .slice(-2).join(' ')
  .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
  .replace(/\b\w/g, c => c.toUpperCase());
const groupFor = key => LABELS[key]?.c || GROUPS[key.split('.')[1]] || 'Other';
const describeFor = key => LABELS[key]?.d || key;
// Thin space every three digits, so a 56651 km odometer reads as 56 651. Done by
// hand rather than with toLocaleString, which would put a comma on one machine
// and a full stop on the next -- the same reason the dates below are built here.
const group = n => {
  const [whole, frac] = String(n).split('.');
  const sign = whole.startsWith('-') ? '-' : '';
  const digits = sign ? whole.slice(1) : whole;
  if (digits.length < 5) return String(n);
  return sign + digits.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (frac ? '.' + frac : '');
};
const fmt = (value, unit, key = '') => {
  if (typeof value === 'boolean') {
    const hit = BOOL_WORDS.find(([re]) => re.test(key));
    return hit ? hit[1][value ? 1 : 0] : (value ? 'Yes' : 'No');
  }
  if (typeof value === 'string') {
    const token = value.trim().toUpperCase();
    if (ENUM_WORDS[token]) return ENUM_WORDS[token];
    // Generic: drop the ASN_ wrapper, split words, sentence case.
    const words = value.replace(/^ASN_is/i, '').replace(/[_-]+/g, ' ').trim();
    return words.charAt(0).toUpperCase() + words.slice(1).toLowerCase();
  }
  if (typeof value === 'number') {
    // Tyre pressures come in kPa; bar is what anyone actually reads off a gauge.
    if (unit === 'kpa') return (value / 100).toFixed(1) + ' bar';
    // BMW counts everything in minutes. "Full in 476 min" is arithmetic
    // homework; "Full in 7h 56min" is an answer.
    if (unit === 'min' || unit === 'minutes') return fmtDuration(value);
    const n = group(Number.isInteger(value) ? value : Math.round(value * 100) / 100);
    if (!unit || unit === '-') return String(n);
    // Symbols bind tight to the number; worded units keep their space.
    const symbol = { percent: '%', degrees: '°' }[unit];
    return symbol ? `${n}${symbol}` : `${n} ${unit}`;
  }
  return '—';
};

/* ---------- dates ---------- */
// YYYY/MM/DD throughout, rather than whatever the browser locale decides.
// Sortable, unambiguous, and the same on every machine that opens the page.
const pad = n => String(n).padStart(2, '0');
const fmtDate = d =>
  `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
const fmtDateTime = d =>
  `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

// Durations. "113.8m" next to "117 km" reads as metres, which is exactly how it
// was read -- a two-hour drive looked like a distance. Hours and minutes, spelt
// so the unit cannot be mistaken for a length.
function fmtDuration(minutes) {
  if (minutes == null) return '';
  const total = Math.round(minutes);
  if (total < 1) return 'under a minute';
  if (total < 60) return `${total} min`;
  const h = Math.floor(total / 60);
  const m = total % 60;
  return m ? `${h}h ${m}min` : `${h}h`;
}

/* ---------- hover readout ---------- */
const hoverEl = document.getElementById('hover');

function stateAt(v, key, t) {
  const s = v.state?.[key];
  if (!s) return null;
  let hit = null;
  for (const row of s.v) { if (row[0] <= t) hit = row; else break; }
  return hit ? { value: hit[1], unit: s.u } : null;
}

function speedAt(v, pt, t) {
  // BMW does not transmit exact speed -- privacy restriction -- and on this car
  // even the bucketed range has never arrived. Prefer BMW's band when it exists,
  // otherwise fall back to what the positions themselves imply.
  const lo = stateAt(v, 'vehicle.vehicle.speedRange.lowerBound', t);
  const hi = stateAt(v, 'vehicle.vehicle.speedRange.upperBound', t);
  if (lo && hi) return `${lo.value}–${hi.value} km/h`;
  if (lo || hi) { const one = lo || hi; return `${one.value} km/h${lo ? '+' : ' or less'}`; }

  if (pt.speed_kmh != null) {
    // A floor, not a reading: the car drove at least the straight line, so its
    // average can only have been higher. Say so rather than implying precision.
    return `≥${pt.speed_kmh} km/h${pt.speed_rough ? ' (rough)' : ''}`;
  }
  return 'not reported';
}

function consumptionOf(pt) {
  // "~" where the odometer's whole-kilometre resolution dominates the answer.
  const a = pt.approx ? '~' : '';
  if (pt.kwh_per_100km != null) return `${a}${pt.kwh_per_100km} kWh/100km`;
  if (pt.l_per_100km != null) return `${a}${pt.l_per_100km} l/100km`;
  if (pt.fuel_pct_per_100km != null) return `${a}${pt.fuel_pct_per_100km} %/100km`;
  if (pt.kwh != null) return `${pt.kwh} kWh recovered`;
  // Known to be electric, but the charge did not move a whole percent over this
  // distance. Saying so beats leaving a blank that reads as an oversight.
  if (pt.unmeasured) return 'too short to measure';
  return null;
}

function showHover(v, pt, e) {
  const t = pt.t;
  const rows = [];
  const push = (label, value) => { if (value != null && value !== '') rows.push([label, value]); };

  push('Speed', speedAt(v, pt, t));
  push('Consumption', consumptionOf(pt));

  const soc = stateAt(v, 'vehicle.drivetrain.batteryManagement.header', t);
  push('Charge', soc && fmt(soc.value, soc.unit, 'soc'));
  const fuel = stateAt(v, 'vehicle.drivetrain.fuelSystem.level', t);
  push('Fuel', fuel && fmt(fuel.value, fuel.unit, 'fuel'));
  const odo = stateAt(v, 'vehicle.vehicle.travelledDistance', t);
  push('Odometer', odo && fmt(odo.value, odo.unit, 'odo'));

  push('Segment', pt.km ? `${pt.km.toFixed(2)} km` : null);
  // How long since the previous fix, so a long line reads as either a fast
  // straight road or a gap in what BMW sent.
  if (pt.gap_s != null) {
    const g = pt.gap_s;
    push('Since last fix', g < 90 ? `${g}s` : `${Math.floor(g/60)}m ${g%60}s`);
  }
  push('Heading', pt.heading != null ? `${pt.heading}°` : null);
  push('Altitude', pt.alt != null ? `${pt.alt} m` : null);
  push('Fix', [pt.fix, pt.sats != null ? `${pt.sats} sats` : null].filter(Boolean).join(' · ') || null);

  // Built as nodes rather than concatenated markup: `rows` carries units and
  // enum values that originate from BMW's catalogue, not from us.
  hoverEl.replaceChildren();
  const when = document.createElement('div');
  when.className = 'h';
  when.textContent = fmtDateTime(new Date(t));
  const mode = document.createElement('div');
  mode.className = 'h';
  const swatch = document.createElement('span');
  swatch.className = 'mode';
  swatch.style.background = colourFor(pt);
  mode.append(swatch, document.createTextNode(pt.mode));
  const dl = document.createElement('dl');
  for (const [k, val] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = val;
    dl.append(dt, dd);
  }
  hoverEl.append(when, mode, dl);

  hoverEl.style.display = 'block';
  // Flip the box away from the pointer near the right/bottom edges so it never
  // runs off screen.
  const p = e.originalEvent;
  const w = hoverEl.offsetWidth, h = hoverEl.offsetHeight;
  const x = p.clientX + 14, y = p.clientY + 14;
  hoverEl.style.left = (x + w > window.innerWidth ? p.clientX - w - 14 : x) + 'px';
  hoverEl.style.top  = (y + h > window.innerHeight ? p.clientY - h - 14 : y) + 'px';
}

function hideHover() { hoverEl.style.display = 'none'; }

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:20,
}).addTo(map);

let vehicles = DATA?.vehicles || [];

// One layer group per car, built once and left off the map until its car is
// selected. Drawing every car at once made two routes in the same town read as
// one improbable journey, and there is no reason that gets better with five.
const layers = new Map();

function buildLayer(v) {
  const group = L.layerGroup();
  if (!v.points?.length) return group;

  for (let i = 1; i < v.points.length; i++) {
    const a = v.points[i-1], b = v.points[i];
    // Only join fixes the exporter judged a real, continuous movement. Skipping
    // the rest is the point: drawing across a feed gap or a post-tunnel jump
    // invents a road that was never travelled.
    if (!b.draw) continue;
    const line = L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {
      color: colourFor(b), weight:5, opacity:.9, lineCap:'round',
    });
    line.on('mousemove', e => showHover(v, b, e));
    line.on('mouseover', e => showHover(v, b, e));
    line.on('mouseout', hideHover);
    group.addLayer(line);
    b._line = line;
  }
  // A dot per received fix. Without these a 500 m straight road and an
  // 8-minute hole in the feed look identical, and BMW's cadence is uneven
  // enough that most long straight lines are the latter.
  for (const p of v.points) {
    const dot = L.circleMarker([p.lat, p.lon], {
      radius: 3.5, weight: 1.5, color: '#fff', opacity: .9,
      fillColor: colourFor(p), fillOpacity: 1,
    });
    dot.on('mousemove', e => showHover(v, p, e));
    dot.on('mouseover', e => showHover(v, p, e));
    dot.on('mouseout', hideHover);
    group.addLayer(dot);
    p._dot = dot;
  }

  const marker = L.marker([v.points[0].lat, v.points[0].lon], { title: v.label })
    .bindPopup(`${v.label} · ${v.vin}`);
  group.addLayer(marker);
  v._marker = marker;
  return group;
}

function buildAllLayers() {
  for (const group of layers.values()) map.removeLayer(group);
  layers.clear();
  for (const v of vehicles) layers.set(v.vin, buildLayer(v));
}

// Deferred to after layout: at script-execution time #map can still measure
// zero, and Leaflet then fits the bounds against nothing and lands on zoom 0 --
// the whole world, with the route an invisible speck. invalidateSize() once the
// geometry is real fixes it.
// Set when a fit was asked for while the map had no real size, so it can be run
// the moment it does. A hidden document performs no layout at all, so the
// container measures zero however long you wait -- delaying the fit does not
// help, and fitting anyway lands on zoom 0: the whole world, route invisible.
let pendingFit = null;

function fitToVehicle(v) {
  const box = mapEl.getBoundingClientRect();
  if (box.width < 40 || box.height < 40) { pendingFit = v; return; }
  pendingFit = null;
  map.invalidateSize();
  // Only what is actually drawn: framing a single trip against the whole
  // month's bounds would leave it a speck in the corner.
  const all = v?.points || [];
  const points = all.filter(pointInFocus);
  if (!points.length) { map.setView([52.1, 5.1], 8); return; }
  if (points.length === 1) { map.setView([points[0].lat, points[0].lon], 14); return; }
  // 12%, not 25%: a quarter of the span on every side costs a whole zoom level
  // on a short map pane, which on a town-sized route is the difference between
  // reading the street names and not.
  map.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lon])).pad(0.12));
  if (map.getZoom() > 16) map.setZoom(15);
}

// The map pane is whatever the bar leaves it, and the bar's height moves with
// the selected car: a hybrid adds a petrol swatch to the legend and a second
// trip button, which is enough to wrap a row and steal ~30px from the map.
// Leaflet does not watch its container, so without this the pane grows and the
// bottom strip stays an unpainted black band until the next pan.
// Run once the browser has laid the page out. requestAnimationFrame is the
// right signal when the tab is visible and never fires when it is not, so a
// hidden tab falls back to a task instead of waiting indefinitely.
function afterLayout(fn) {
  if (document.visibilityState !== 'hidden') {
    requestAnimationFrame(() => requestAnimationFrame(fn));
    return;
  }
  // A hidden tab runs no animation frames. Do both: a delayed timeout so the
  // map is drawn against a laid-out container even if the page is never looked
  // at, and a re-fit when it does become visible.
  //
  // Waiting only for visibility leaves the map permanently blank anywhere the
  // document reports hidden for its whole life -- an embedded preview pane, a
  // headless capture. Firing only a timeout at 0ms fits against a zero-height
  // container and lands on zoom 0, the whole world with the route a speck.
  // Neither alone is enough.
  setTimeout(fn, 150);
  document.addEventListener('visibilitychange', function once() {
    if (document.visibilityState === 'hidden') return;
    document.removeEventListener('visibilitychange', once);
    requestAnimationFrame(() => requestAnimationFrame(fn));
  });
}

const mapEl = document.getElementById('map');
if (window.ResizeObserver) {
  // Inside a frame: calling invalidateSize synchronously from the callback
  // makes browsers complain about an undelivered-notification loop.
  new ResizeObserver(() => requestAnimationFrame(() => {
    map.invalidateSize();
    // The container getting a real size is the signal a deferred fit was
    // waiting for, and it arrives whatever the reason -- the tab being shown, a
    // window resize, a preview pane finally laying out.
    if (pendingFit) fitToVehicle(pendingFit);
  })).observe(mapEl);
}
window.addEventListener('resize', () => map.invalidateSize());

/* ---------- timeline ---------- */
// Per vehicle, not shared. One axis across all cars means the slider is scaled
// to whichever has the longest history: with 36 fixes over eleven hours on one
// car and 2 fixes over two minutes on another, the whole of the second car sits
// in the last pixel of the track and scrubbing it is impossible.
//
// State changes count as events too, so a car that has never reported a GPS fix
// still gets a scrubbable history.
// Narrowed by the date/trip pickers when either is set, so the slider spans
// exactly what is drawn rather than the car's whole history.
function timesFor(v) {
  let times = [...new Set([
    ...(v?.points || []).map(p => p.t),
    ...Object.values(v?.state || {}).flatMap(s => s.v.map(([t]) => t)),
  ])].sort((a, b) => a - b);

  if (focus.trip != null) {
    const t = (v?.trips || []).find(x => x.trip === focus.trip);
    // Keep the state changes that fall inside the drive, so the dashboard still
    // moves while scrubbing a single trip.
    if (t) times = times.filter(x => x >= t.start && x <= t.end);
  } else if (focus.date) {
    times = times.filter(x => fmtDate(new Date(x)) === focus.date);
  }
  return times;
}

let allTimes = [];
const slider = document.getElementById('slider');
const clock  = document.getElementById('clock');

const lastAtOrBefore = (arr, t, key = x => x.t) => {
  let found = null;
  for (const item of arr) { if (key(item) <= t) found = item; else break; }
  return found;
};

/* ---------- state panel ---------- */
let current = vehicles[0];
const stateEl = document.getElementById('state');
const tiles = new Map();

function buildPanel(v) {
  // Rebuilt wholesale on every live update, which reset the reader's place in
  // a long panel every 15 seconds. Restoring afterwards is enough: the content
  // is the same height unless the car reported a brand new key.
  const scroll = stateEl.scrollTop;
  stateEl.innerHTML = '';
  tiles.clear();
  if (!v || !v.state || !Object.keys(v.state).length) {
    stateEl.innerHTML = '<div class="note">No telemetry recorded for this vehicle yet.</div>';
    return;
  }
  const priority = priorityFor(v);
  const keys = Object.keys(v.state);
  const ordered = [
    ...priority.filter(k => keys.includes(k)),
    ...keys.filter(k => !priority.includes(k)).sort(),
  ];
  const byGroup = new Map([['Key readings', []]]);
  for (const k of ordered) {
    const g = priority.includes(k) ? 'Key readings' : groupFor(k);
    if (!byGroup.has(g)) byGroup.set(g, []);
    byGroup.get(g).push(k);
  }
  for (const [group, groupKeys] of byGroup) {
    if (!groupKeys.length) continue;
    const wrap = document.createElement('div');
    wrap.className = 'group';
    wrap.innerHTML = `<h4>${group}</h4>`;
    const grid = document.createElement('div');
    grid.className = 'tiles';
    for (const k of groupKeys) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (priority.indexOf(k) > -1
        && priority.indexOf(k) < PRIMARY_COUNT ? ' primary' : '');
      tile.title = `${describeFor(k)}\n\n${k}`;
      // textContent, not innerHTML: these labels come verbatim from BMW's
      // public catalogue API and this page is published to GitHub Pages.
      const kEl = document.createElement('div');
      kEl.className = 'k';
      kEl.textContent = labelFor(k);
      const vEl = document.createElement('div');
      vEl.className = 'v';
      vEl.textContent = '—';
      tile.append(kEl, vEl);
      grid.appendChild(tile);
      tiles.set(k, tile);
    }
    wrap.appendChild(grid);
    stateEl.appendChild(wrap);
  }
  stateEl.scrollTop = scroll;
}

function paintPanel(v, t) {
  if (!v?.state) return;
  for (const [key, tile] of tiles) {
    const series = v.state[key];
    const hit = series && lastAtOrBefore(series.v, t, x => x[0]);
    const valueEl = tile.querySelector('.v');
    valueEl.textContent = hit ? fmt(hit[1], series.u, key) : '—';
    // Grey out anything not yet reported at this point on the timeline.
    tile.classList.toggle('stale', !hit);
  }
}

/* ---------- the "right now" strip ---------- */
// Deliberately not tied to the slider. The dashboard below already answers
// "what was it doing at this moment"; this answers "how much is left", which is
// the question you glance at the page for while the car is out.
const NOW_KEYS = {
  soc: 'vehicle.drivetrain.batteryManagement.header',
  electric: 'vehicle.drivetrain.electricEngine.kombiRemainingElectricRange',
  fuel: 'vehicle.drivetrain.fuelSystem.level',
  total: 'vehicle.drivetrain.lastRemainingRange',
};
const nowEl = document.getElementById('now');

function latestOf(v, key) {
  const s = key && v?.state?.[key];
  if (!s?.v?.length) return null;
  const [t, value] = s.v.at(-1);
  return { value, t, unit: s.u };
}

function nowGroup(icon, label, pct, km, note) {
  const g = document.createElement('span');
  g.className = 'grp';
  const level = pct == null ? null : pct <= 10 ? 'empty' : pct <= 25 ? 'low' : 'ok';
  if (level) g.classList.add(level);

  // The emoji is decoration: a screen reader announcing "high voltage sign"
  // helps nobody. The name is carried by real text instead.
  const i = document.createElement('span');
  i.className = 'ico';
  i.textContent = icon;
  i.setAttribute('aria-hidden', 'true');
  g.append(i, Object.assign(document.createElement('span'),
    { className: 'sr', textContent: `${label}: ` }));

  if (pct != null) {
    const p = document.createElement('span');
    p.className = 'pct';
    p.textContent = `${group(pct)}%`;
    g.appendChild(p);
    // Not colour alone.
    if (level !== 'ok') {
      const l = document.createElement('span');
      l.className = 'lvl';
      l.textContent = level === 'empty' ? 'empty' : 'low';
      g.appendChild(l);
    }
  }
  if (km != null) {
    const r = document.createElement('span');
    r.className = 'rng';
    r.textContent = `${group(Math.round(km))} km`;
    g.appendChild(r);
  }
  g.title = note ? `${label}\n${note}` : label;
  return g;
}

function paintNow(v) {
  nowEl.replaceChildren();
  const soc = latestOf(v, v?.soc_key) || latestOf(v, NOW_KEYS.soc);
  const electric = latestOf(v, NOW_KEYS.electric);
  const fuel = latestOf(v, NOW_KEYS.fuel);
  const total = latestOf(v, NOW_KEYS.total);

  // The state series holds value *changes* only, so the last entry is when the
  // reading last moved, not when it was last confirmed. A tank sitting at 100%
  // legitimately has its most recent entry a day back; calling that "reported"
  // would be wrong.
  const when = r => r ? `unchanged since ${fmtDateTime(new Date(r.t))}` : '';
  const parts = [];

  if (soc || electric) {
    parts.push(nowGroup('⚡', 'Battery charge and electric range',
      soc?.value ?? null, electric?.value ?? null, when(soc || electric)));
  }

  // A battery car has no tank; BMW still sends lastRemainingRange as a flat 0,
  // which would render as a very alarming "0 km".
  if (v?.burns_fuel !== false) {
    // BMW reports a combined range, not a petrol one. The difference is the
    // only petrol figure available, so it is derived and labelled as such.
    const petrol = (total?.value != null && total.value > 0)
      ? Math.max(0, total.value - (electric?.value ?? 0))
      : null;
    if (fuel || petrol != null) {
      parts.push(nowGroup('⛽', 'Fuel level and petrol range',
        fuel?.value ?? null, petrol,
        [when(fuel || total),
         petrol != null ? 'petrol range = combined range minus electric' : '']
          .filter(Boolean).join('\n')));
    }
  }

  // When the car last said anything at all. Without this the strip quietly
  // claims to be current: the X5 sat showing 5% for hours after it had actually
  // finished charging, because BMW never sent a "charge complete" and there was
  // nothing on screen to say the reading was old.
  const newest = Math.max(
    0,
    ...(v?.points || []).map(p => p.t),
    ...Object.values(v?.state || {}).map(s => s.v.at(-1)?.[0] ?? 0),
  );
  // Not on the published demo: its data is invented and fixed in the past, so
  // the honest answer there is "139d ago", which reads as a broken page rather
  // than as a sample.
  if (newest && !DATA?.static) {
    const age = document.createElement('span');
    age.className = 'age';
    age.dataset.t = String(newest);
    age.title = `Last message from the car: ${fmtDateTime(new Date(newest))}`;
    parts.push(age);
  }

  nowEl.hidden = !parts.length;
  for (const p of parts) nowEl.appendChild(p);
  paintAges();
  syncAgeTimer();
}

// "8 min ago" is itself out of date a minute later, so the label is recomputed
// on a timer rather than only when new data lands.
function paintAges() {
  for (const el of nowEl.querySelectorAll('.age')) {
    const secs = (Date.now() - Number(el.dataset.t)) / 1000;
    el.textContent = relativeAge(secs);
    el.classList.toggle('stale', secs > STALE_AFTER_S);
  }
}
const STALE_AFTER_S = 3600;
function relativeAge(s) {
  if (s < 90) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

// Only while there is an age on screen and someone able to see it. A timer that
// reruns every 30 seconds for a label nobody is looking at -- or that is not in
// the DOM at all, as on the demo -- is a wakeup bought for nothing.
let ageTimer = null;
function syncAgeTimer() {
  const wanted = document.visibilityState === 'visible'
    && nowEl.querySelector('.age') !== null;
  if (wanted && ageTimer === null) ageTimer = setInterval(paintAges, 30000);
  else if (!wanted && ageTimer !== null) { clearInterval(ageTimer); ageTimer = null; }
}
document.addEventListener('visibilitychange', () => { paintAges(); syncAgeTimer(); });

/* ---------- apply ---------- */
// Only the selected car: the others are not on the map, and painting their
// geometry would be work nobody can see.
function apply(idx) {
  const t = allTimes[idx] ?? allTimes[allTimes.length - 1];
  clock.textContent = t ? fmtDateTime(new Date(t)) : '—';
  const v = current;
  if (v?._marker) {
    const p = lastAtOrBefore(v.points, t);
    if (p) { v._marker.setLatLng([p.lat, p.lon]); v._marker.setOpacity(1); }
    else v._marker.setOpacity(.25);
  }
  for (const p of v?.points || []) {
    const past = p.t <= t;
    const s = past ? PAST : AHEAD;
    if (p._line) p._line.setStyle({ opacity: s.line, weight: s.weight });
    if (p._dot) p._dot.setStyle({ opacity: s.dotStroke, fillOpacity: s.dotFill,
                                  radius: s.radius });
  }
  paintPanel(v, t);
}

slider.addEventListener('input', () => apply(+slider.value));
document.getElementById('end').addEventListener('click', () => {
  slider.value = slider.max; apply(+slider.max);
});

let timer = null;
const play = document.getElementById('play');
play.addEventListener('click', () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = '▶︎ Play'; play.classList.remove('on'); return; }
  play.textContent = '❚❚ Pause'; play.classList.add('on');
  timer = setInterval(() => {
    let next = +slider.value + 1;
    if (next > +slider.max) next = 0;
    slider.value = next; apply(next);
  }, 220);
});

/* ---------- vehicle switcher ---------- */
// Built from whatever is in the data. Cars are discovered from the telemetry
// itself, so a new one appears here the first time it streams anything -- no
// list to maintain, and nothing here assumes there are exactly two.
const vehiclesEl = document.getElementById('vehicles');
const legendEl = document.getElementById('legend');
const notesEl = document.getElementById('notes');
const buttons = new Map();

function selectVehicle(v, { fit = true } = {}) {
  if (!v) return;
  const previous = current;
  current = v;

  // Map: swap which car is drawn, then frame it.
  if (previous && previous !== v) map.removeLayer(layers.get(previous.vin));
  const group = layers.get(v.vin);
  if (group && !map.hasLayer(group)) group.addTo(map);
  hideHover();

  for (const [vin, button] of buttons) button.classList.toggle('on', vin === v.vin);
  // With enough cars the row scrolls, and the one that opens by default can be
  // off the right-hand end -- looking, from the visible buttons alone, as though
  // nothing is selected at all.
  buttons.get(v.vin)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

  // A petrol swatch on a car that has never burnt a drop is just noise.
  for (const item of legendEl.querySelectorAll('[data-mode="petrol"]')) {
    item.style.display = v.burns_fuel === false ? 'none' : '';
  }

  buildPanel(v);
  paintNow(v);
  showNotes(v);
  // The tab title names what you are actually looking at, so a window full of
  // them can be told apart.
  document.title = v.label ? `${labelOf(v)} — BMW CarData` : 'BMW CarData — track';

  // Each car has its own dates and trips, so a filter from the previous one
  // means nothing here. setFocus does the rest: geometry, timeline, and the
  // deferred fit.
  focus = { date: null, trip: null };
  buildDatePicker(v);
  setFocus({}, { fit });
}

function showNotes(v) {
  const parts = [...(v?.notes || []), ...(DATA?.notes || [])];
  // A window must not pass for the whole record. Only says so when it is
  // actually a window -- ?days=0 sends everything and gets no note.
  if (LIVE && DATA?.window_days) {
    parts.unshift(`showing the last ${DATA.window_days} days — ?days=0 for everything`);
  }
  if (!vehicles.length) parts.unshift('No telemetry recorded yet.');
  const renamed = v && overrideFor(v);
  if (renamed) {
    parts.unshift(
      `“${renamed.name}” is this browser's name for it; everything else still ` +
      `calls it “${renamed.base}”`
    );
  }
  parts.push(`generated ${DATA?.generated ? fmtDateTime(new Date(DATA.generated)) : '—'}`);
  notesEl.textContent = parts.join('  ·  ');
}

/* ---------- names ---------- */
// A page opened over file:// cannot write config.toml, so a name typed here is
// kept in this browser instead. config.toml stays the real store -- the menu bar
// writes it, the exporter and CLI read it -- and this is a quick override on top
// for relabelling without leaving the map.
const NAME_STORE = 'bmwcd.vehicleNames';
const MAX_NAME = 40;

function readOverrides() {
  try { return JSON.parse(localStorage.getItem(NAME_STORE)) || {}; }
  catch { return {}; }  // private mode, or a browser that walls off file://
}
const overrides = readOverrides();

function saveOverrides() {
  try { localStorage.setItem(NAME_STORE, JSON.stringify(overrides)); return true; }
  catch { return false; }
}

// Each override remembers the label it replaced. If config.toml later names the
// car something else, that is a deliberate act and wins -- otherwise a name
// typed here once would quietly outrank every config change that followed it.
const exportedLabel = v => v.label || v.vin.slice(-6);
const overrideFor = v => {
  const o = overrides[v.vin];
  return o && o.base === exportedLabel(v) ? o : null;
};
const labelOf = v => overrideFor(v)?.name || exportedLabel(v);

// Drop overrides that have been outranked, and ones for cars no longer in the
// data. Left alone they are harmless but permanent: ignored on every read, and
// still sitting there years later.
function pruneOverrides() {
  // Never prune against an empty vehicle list. An empty `vehicles` means the
  // payload did not arrive -- a 500 from the map server, a failed fetch -- not
  // that every car vanished. Pruning there deletes every stored rename and
  // persists {}, silently and unrecoverably.
  if (!vehicles.length) return;
  const live = new Set(vehicles.map(v => v.vin));
  let pruned = false;
  for (const [vin, o] of Object.entries(overrides)) {
    const v = vehicles.find(x => x.vin === vin);
    if (!live.has(vin) || o?.base !== exportedLabel(v)) {
      delete overrides[vin];
      pruned = true;
    }
  }
  if (pruned) saveOverrides();
}

function paintButton(v) {
  const button = buttons.get(v.vin);
  if (!button) return;
  const fixes = (v.points || []).length;
  button.querySelector('.name').textContent = labelOf(v);
  button.querySelector('.sub').textContent =
    `${fixes} fix${fixes === 1 ? '' : 'es'} · ${Object.keys(v.state || {}).length} keys`;
  button.classList.toggle('renamed', !!overrideFor(v));
  button.title = overrideFor(v)
    ? `${v.vin}\nRenamed in this browser; config.toml still calls it ` +
      `"${exportedLabel(v)}".\nDouble-click to change, or clear it to go back.`
    : `${v.vin}\nDouble-click to rename.`;
  if (v._marker) v._marker.setPopupContent(`${labelOf(v)} · ${v.vin}`);
}

function beginRename(v) {
  const button = buttons.get(v.vin);
  if (!button || !button.isConnected) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename';
  input.value = labelOf(v);
  input.maxLength = MAX_NAME;
  input.title = `Naming ${v.vin}\nEnter saves, Escape cancels, empty resets.`;
  button.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const typed = input.value;
    input.replaceWith(button);

    if (commit) {
      const name = typed.replace(/\s+/g, ' ').trim().slice(0, MAX_NAME);
      // Emptying it, or typing back exactly what config already says, clears the
      // override rather than storing a redundant copy of it.
      if (!name || name === exportedLabel(v)) delete overrides[v.vin];
      else overrides[v.vin] = { name, base: exportedLabel(v) };
      var stored = saveOverrides();
    }
    paintButton(v);
    if (v === current) showNotes(v);
    if (commit && !stored) {
      notesEl.textContent =
        'Renamed for this session only — this browser would not store it. ' +
        'Use “Rename vehicle” in the menu bar to make it stick.';
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function buildSwitcher() {
  // A live update rebuilds this row every 15 seconds. Doing that mid-rename
  // detaches the input the user is typing into: blur does not reliably fire on
  // a removed node, so the typed name was silently lost. The row is unchanged
  // by an update anyway unless a car appeared, so skipping is safe.
  if (vehiclesEl.querySelector('input.rename')) return;
  buttons.clear();
  vehiclesEl.replaceChildren();
  for (const v of vehicles) {
    const button = document.createElement('button');
    const name = document.createElement('span');
    name.className = 'name';
    const sub = document.createElement('span');
    sub.className = 'sub';
    button.append(name, sub);
    button.addEventListener('click', () => selectVehicle(v));
    button.addEventListener('dblclick', e => { e.preventDefault(); beginRename(v); });
    buttons.set(v.vin, button);
    vehiclesEl.appendChild(button);
    paintButton(v);
  }
  // With one car there is nothing to switch between, but it can still be
  // renamed, so the row stays.
  document.querySelector('.vehrow').style.display = vehicles.length ? '' : 'none';
}

/* ---------- date and trip pickers ---------- */
// Position updates stop entirely while parked, so a day's fixes are several
// separate drives rather than one route, and a month of retention is dozens of
// them across dozens of days. Two dropdowns rather than a row of buttons: the
// button row was already scrolling sideways with a single day on it.

const dateSel = document.getElementById('datesel');
const tripSel = document.getElementById('tripsel');
const clearFocusBtn = document.getElementById('clearfocus');
const focusNote = document.getElementById('focusnote');

// What the page is narrowed to. Both null means the whole history of the
// selected car; a trip always implies its own date.
let focus = { date: null, trip: null };

function dayOf(t) { return fmtDate(new Date(t)); }

// Trips are the ones that actually covered ground. A "trip" of 0 km is a burst
// of parked fixes that the exporter kept as its own group, and offering it here
// would be offering something with nothing to show.
const drivenTrips = v => (v?.trips || []).filter(t => t.km > 0);

function daysFor(v) {
  const days = new Map();
  const touch = day => days.get(day) ||
    (days.set(day, { fixes: 0, trips: new Set(), km: 0 }), days.get(day));

  for (const p of v?.points || []) {
    const e = touch(dayOf(p.t));
    e.fixes++;
    e.km += p.km || 0;
  }
  for (const t of drivenTrips(v)) touch(dayOf(t.start)).trips.add(t.trip);
  // Days with no fix at all but some state change -- a parked car reporting a
  // charge finishing is still a day with something on it.
  for (const s of Object.values(v?.state || {})) {
    for (const [t] of s.v) touch(dayOf(t));
  }
  return [...days.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));  // newest first
}

function tripSummary(t) {
  const parts = [`${t.km} km`, fmtDuration(t.minutes)];
  if (t.avg_kmh != null) parts.push(`${t.avg_kmh} km/h incl. stops`);
  const a = t.approx ? '~' : '';
  if (t.kwh_per_100km != null) parts.push(`${a}${t.kwh_per_100km} kWh/100km`);
  if (t.l_per_100km != null) parts.push(`${a}${t.l_per_100km} l/100km`);
  if (t.fuel_pct_per_100km != null) parts.push(`${a}${t.fuel_pct_per_100km} %/100km`);
  if (t.unmeasured) parts.push('electric · too short to measure');
  return parts.join(' · ');
}

function option(value, text) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  return o;
}

// The two days anyone actually looks for, named rather than counted out. Built
// through the same fmtDate that produced the option values, so the comparison
// is like-for-like: comparing against an ISO slice of a UTC date would label the
// wrong row for anyone east or west of UTC for part of the day.
function relativeDay(day) {
  const today = new Date();
  if (day === fmtDate(today)) return 'today';
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  return day === fmtDate(yesterday) ? 'yesterday' : null;
}

function buildDatePicker(v) {
  const days = daysFor(v);
  dateSel.replaceChildren(option('', `All dates (${days.length})`));
  for (const [day, e] of days) {
    const bits = [];
    if (e.trips.size) bits.push(`${e.trips.size} trip${e.trips.size > 1 ? 's' : ''}`);
    if (e.fixes) bits.push(`${e.fixes} fix${e.fixes === 1 ? '' : 'es'}`);
    if (!bits.length) bits.push('state only');
    // Rebuilt on every live update, so this re-evaluates rather than freezing
    // "today" at whatever it was when a long-open tab was first loaded.
    const rel = relativeDay(day);
    const label = rel ? `${day} (${rel})` : day;
    dateSel.appendChild(option(day, `${label} — ${bits.join(', ')}`));
  }
  dateSel.value = focus.date || '';
  dateSel.disabled = !days.length;
}

function buildTripPicker(v) {
  // Trips on the chosen day, or every trip when no day is chosen.
  const trips = drivenTrips(v)
    .filter(t => !focus.date || dayOf(t.start) === focus.date)
    .sort((a, b) => a.start - b.start);
  tripSel.replaceChildren(option('', trips.length
    ? `All trips (${trips.length})`
    : 'No trips with distance'));
  // Without a date filter the list can span days, and a bare "10:54" then does
  // not say which one. Only worth the extra width when it is actually ambiguous.
  const spansDays = new Set(trips.map(t => dayOf(t.start))).size > 1;
  for (const t of trips) {
    const when = spansDays
      ? `${dayOf(t.start).slice(5)} ${fmtTime(new Date(t.start))}`
      : fmtTime(new Date(t.start));
    tripSel.appendChild(option(
      String(t.trip),
      `${when} · ${t.km} km · ${fmtDuration(t.minutes)}`,
    ));
  }
  // A trip selected on another day cannot survive the date changing under it.
  if (focus.trip != null && !trips.some(t => t.trip === focus.trip)) focus.trip = null;
  tripSel.value = focus.trip == null ? '' : String(focus.trip);
  tripSel.disabled = !trips.length;
}

function tripById(v, id) { return (v?.trips || []).find(t => t.trip === id); }

// What is on screen right now, in one line.
function describeFocus(v) {
  if (focus.trip != null) {
    const t = tripById(v, focus.trip);
    return t ? `${fmtDate(new Date(t.start))} ${fmtTime(new Date(t.start))} — ${tripSummary(t)}`
             : '';
  }
  const trips = drivenTrips(v).filter(t => !focus.date || dayOf(t.start) === focus.date);
  if (!trips.length) return focus.date ? 'no trips with distance on this date' : '';
  const km = Math.round(trips.reduce((sum, t) => sum + t.km, 0) * 10) / 10;
  return `${trips.length} trip${trips.length > 1 ? 's' : ''} · ${km} km total`;
}

function pointInFocus(p) {
  if (focus.trip != null) return p.trip === focus.trip;
  if (focus.date) return dayOf(p.t) === focus.date;
  return true;
}

// Layers are added and removed rather than faded to transparent: an invisible
// polyline still answers the mouse, and a tooltip rising out of blank map for a
// drive you have filtered away is worse than not filtering at all.
function applyFocusToGeometry(v) {
  const group = layers.get(v?.vin);
  if (!group) return;
  for (const p of v.points || []) {
    const want = pointInFocus(p);
    for (const layer of [p._line, p._dot]) {
      if (!layer) continue;
      if (want && !group.hasLayer(layer)) group.addLayer(layer);
      else if (!want && group.hasLayer(layer)) group.removeLayer(layer);
    }
  }
}

// `fit` exists for the live-update path. The fit is queued two frames out, so
// it lands *after* ingest has synchronously restored the user's pan/zoom and
// silently overwrites it -- which made the whole userMoved/keep.view mechanism
// a no-op and yanked the map back to route bounds every 15 seconds.
function setFocus(next, { rebuildTrips = true, fit = true } = {}) {
  focus = { ...focus, ...next };
  const v = current;
  if (rebuildTrips) buildTripPicker(v);
  dateSel.value = focus.date || '';
  tripSel.value = focus.trip == null ? '' : String(focus.trip);

  applyFocusToGeometry(v);
  allTimes = timesFor(v);
  slider.max = Math.max(0, allTimes.length - 1);
  slider.value = slider.max;
  slider.disabled = allTimes.length < 2;

  clearFocusBtn.hidden = !focus.date && focus.trip == null;
  focusNote.textContent = describeFocus(v);
  hideHover();
  apply(+slider.value);
  if (!applyingUrl) writeUrl({ push: true });
  if (fit) afterLayout(() => fitToVehicle(v));
}

/* ---------- the URL is the state ---------- */
// So a particular drive can be bookmarked, sent, or reopened after a restart,
// and so Back undoes a filter instead of leaving the page. Written with
// replaceState while scrubbing about and pushState only on a real change, so
// the history stack stays the size of the decisions actually made.
function urlState() {
  const p = new URLSearchParams(location.search);
  return { vin: p.get('car'), date: p.get('date'), trip: p.has('trip') ? Number(p.get('trip')) : null };
}

function writeUrl({ push = false } = {}) {
  // Seed from the current query and clear only the keys this function owns, so
  // params it does not own survive. ?days= is read back out of location.search
  // on every poll: rebuilding from an empty URLSearchParams dropped it on the
  // first write, so a ?days=0 tab silently fell back to the default window and
  // a reload lost it entirely.
  const p = new URLSearchParams(location.search);
  for (const key of ['car', 'date', 'trip']) p.delete(key);
  if (current) p.set('car', current.vin);
  if (focus.date) p.set('date', focus.date);
  if (focus.trip != null) p.set('trip', String(focus.trip));
  const next = `${location.pathname}${p.toString() ? '?' + p : ''}`;
  if (next === location.pathname + location.search) return;
  history[push ? 'pushState' : 'replaceState']({}, '', next);
}

// Back/Forward: re-apply whatever the URL now says, without writing it again.
let applyingUrl = false;
window.addEventListener('popstate', () => {
  const want = urlState();
  const v = vehicles.find(x => x.vin === want.vin) || current;
  applyingUrl = true;
  try {
    if (v && v !== current) selectVehicle(v);
    setFocus({ date: want.date, trip: want.trip });
  } finally { applyingUrl = false; }
});

dateSel.addEventListener('change', () => setFocus({ date: dateSel.value || null }));
tripSel.addEventListener('change', () => {
  const id = tripSel.value === '' ? null : Number(tripSel.value);
  // Picking a trip from "All dates" pins the date too, so the two controls
  // never disagree about what is on screen.
  const t = id == null ? null : tripById(current, id);
  setFocus({ trip: id, date: t ? dayOf(t.start) : focus.date }, { rebuildTrips: !!t });
});
clearFocusBtn.addEventListener('click', () => setFocus({ date: null, trip: null }));

/* ---------- loading, and reloading ---------- */

// Whichever car has said something most recently -- that is the one you came to
// look at.
function mostRecentVehicle() {
  const stamp = v => Math.max(
    ...(v.points || []).map(p => p.t),
    ...Object.values(v.state || {}).flatMap(s => s.v.map(([t]) => t)),
    0,
  );
  return vehicles.slice().sort((a, b) => stamp(b) - stamp(a))[0];
}

// Swap in a payload and rebuild everything derived from it. Used for the first
// render and for every live update, so there is one code path rather than two
// that drift apart.
function ingest(payload, { keep = null } = {}) {
  DATA = payload;
  LABELS = payload?.labels || {};
  vehicles = payload?.vehicles || [];

  pruneOverrides();
  buildAllLayers();
  buildSwitcher();

  // On a cold load the URL wins: a bookmarked drive should open as the drive it
  // was bookmarked as, not as whatever reported most recently.
  const fromUrl = keep ? null : urlState();
  const wanted = keep?.vin || fromUrl?.vin;
  const target = (wanted && vehicles.find(v => v.vin === wanted)) || mostRecentVehicle();
  current = target || null;
  showNotes(current);
  if (!current) return;

  // A live update is the page reloading itself, not a user decision, so nothing
  // below may touch history. Without this the keep path pushed two entries per
  // update -- one from selectVehicle's own setFocus, one from the focus restore
  // -- roughly 480 an hour with a filter active, after which Back no longer
  // undoes a filter or leaves the page, and Safari starts rate-limiting.
  // Unconditional, not just on the keep path: the cold render is no more a user
  // decision than a live update is. Leaving it false there meant the very first
  // paint pushed an entry, so Back returned to the same page instead of leaving
  // it. The cold path writes the URL with replaceState at the end regardless.
  applyingUrl = true;
  try {
    // Suppress the queued fit when a view is about to be restored, or it lands
    // two frames later and overwrites it.
    selectVehicle(current, { fit: !keep?.view });
    if (!keep) {
      // Validate against what this car actually has, exactly as the keep path
      // does. An unreachable ?date= -- a stale bookmark, a hand-edited URL, a
      // link to a day this car did not drive -- otherwise left the date control
      // blank and the map empty, with no way back but deleting the parameter.
      const known = new Set([...dateSel.options].map(o => o.value));
      const date = fromUrl?.date && known.has(fromUrl.date) ? fromUrl.date : null;
      const trip = fromUrl?.trip != null && tripById(current, fromUrl.trip)
        ? fromUrl.trip : null;
      if (date || trip != null) setFocus({ date, trip });
      writeUrl();  // replaceState, so an invalid parameter is dropped from the bar
      return;
    }

    // Put the view back where the user had it. selectVehicle resets the filter,
    // which is right when *they* switch cars and wrong when the page reloaded
    // itself underneath them.
    const days = new Set([...dateSel.options].map(o => o.value));
    const date = days.has(keep.date) ? keep.date : null;
    const trip = keep.trip != null && tripById(current, keep.trip) ? keep.trip : null;
    if (date || trip != null) setFocus({ date, trip }, { fit: !keep.view });

    // Scrubbed to a moment: hold that moment. Parked at the end: follow the end,
    // which is the whole point of leaving the page open.
    if (!keep.atLatest && keep.t != null) {
      const idx = allTimes.findIndex(x => x >= keep.t);
      slider.value = idx < 0 ? slider.max : idx;
      apply(+slider.value);
    }
    if (keep.view) map.setView(keep.view.center, keep.view.zoom, { animate: false });
  } finally {
    applyingUrl = false;
  }
}

/* ---------- live updates ---------- */
// Only when there is actually something to poll. Opened off disk the page
// cannot fetch at all -- a file:// origin is opaque -- but protocol alone is
// not enough either: the demo is served over https from GitHub Pages, where
// this showed a live badge, asked for stamp.json every 15 seconds, got a 404
// every time, and sat there greyed out. A payload that declares itself a
// snapshot is taken at its word.
const LIVE = !DATA?.static
  && (location.protocol === 'http:' || location.protocol === 'https:');
const POLL_MS = 15000;

async function pollOnce(state) {
  // Both fetches check res.ok. serve.py returns its error body as perfectly
  // valid JSON with a 500 status, so without this an error object is ingested
  // as data: the map is stripped, `current` goes null, the panel keeps showing
  // the previous car, and pruneOverrides deletes every stored rename.
  const stampRes = await fetch('stamp.json', { cache: 'no-store' });
  if (!stampRes.ok) throw new Error(`stamp.json returned ${stampRes.status}`);
  const stamp = await stampRes.json();
  const key = `${stamp.latest}|${stamp.rows}`;
  if (key === state.key) return;
  if (state.key === null) { state.key = key; return; }  // baseline only

  // Carry the page's own window through, so a tab opened with ?days=0 keeps
  // getting everything instead of silently narrowing on the first update.
  const days = new URLSearchParams(location.search).get('days');
  const url = days === null ? 'data.json' : `data.json?days=${encodeURIComponent(days)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`data.json returned ${res.status}`);
  const payload = await res.json();
  if (!Array.isArray(payload?.vehicles) || !payload.vehicles.length) {
    throw new Error('payload contained no vehicles');
  }
  // Capture where the user is before pulling the rug out.
  ingest(payload, {
    keep: {
      vin: current?.vin,
      date: focus.date,
      trip: focus.trip,
      atLatest: +slider.value === +slider.max,
      t: allTimes[+slider.value],
      // Only if they have moved the map themselves; otherwise let the new data
      // reframe it, so a drive in progress stays in view as it extends.
      view: state.userMoved ? { center: map.getCenter(), zoom: map.getZoom() } : null,
    },
  });
  // Commit the stamp only once the data is actually in. Advancing it before the
  // fetch meant a failed update was never retried: the next poll saw the same
  // stamp, returned early, and cleared the stale class -- a green live dot over
  // data that never loaded, until the car happened to report again.
  state.key = key;
  flashLive();
}

function flashLive() {
  // Reachable with no vehicle selected -- a payload that arrives while the
  // switcher is empty still flashes -- and latestOf(current, ...) throws there,
  // which kills the poll tick and marks the stream stale for no reason.
  if (!current) return;
  liveDot.classList.remove('pulse');
  void liveDot.offsetWidth;  // restart the animation rather than ignore it
  liveDot.classList.add('pulse');
  liveDot.title = `Updated ${fmtDateTime(new Date())}`;
  // A pulsing dot says nothing to a screen reader. This is the one event on the
  // page worth interrupting for, so it is the one thing announced.
  const soc = latestOf(current, current?.soc_key) || latestOf(current, NOW_KEYS.soc);
  document.getElementById('announce').textContent =
    `New data for ${labelOf(current)}${soc ? `, charge ${soc.value}%` : ''}.`;
}

// Top level, not inside startLive: the visibility handler at the bottom of this
// file needs it too, and it must also read false when live polling is off (the
// demo, a page opened off disk) rather than being undefined.
let userMovedMap = false;

function startLive() {
  const state = { key: null, get userMoved() { return userMovedMap; } };
  // Only genuine user gestures pin the view across an update. Listening to
  // Leaflet's move/zoom events instead would fire on our own fitBounds, so the
  // view would count as "user-controlled" from the first render onwards and a
  // drive in progress would never stay framed.
  const mark = () => { userMovedMap = true; };
  map.on('dragend', mark);
  mapEl.addEventListener('wheel', mark, { passive: true });
  mapEl.addEventListener('dblclick', mark);
  mapEl.addEventListener('click', e => {
    if (e.target.closest('.leaflet-control-zoom')) mark();
  });

  // .then before .catch, not after: a catch handler returns a resolved promise,
  // so a trailing .then runs on the failure path too and would clear the very
  // class the catch just set.
  const tick = () => pollOnce(state)
    .then(() => liveDot.classList.remove('stale'))
    // The server is gone (menu bar quit, laptop asleep). Keep trying quietly --
    // it comes back, and a page full of error text helps nobody.
    .catch(() => liveDot.classList.add('stale'));

  // Polling stops entirely while the tab is hidden, and catches up in one go
  // when it comes back. A tab left open on a laptop was asking for stamp.json
  // 5,760 times a day whether or not anyone could see it; the browser throttles
  // background timers but does not stop them, and each one still wakes this
  // page, the server and Postgres behind it.
  let timer = null;
  const start = () => { if (timer === null) timer = setInterval(tick, POLL_MS); };
  const stop = () => { clearInterval(timer); timer = null; };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { tick(); start(); } else stop();
  });

  tick();
  if (document.visibilityState === 'visible') start();
}

/* ---------- theme ---------- */
// Three states rather than two. A plain light/dark switch has to start at one of
// them, which means a page that ignores the system setting the first time it is
// opened; "auto" keeps following the system until you actually express a
// preference, and remembers it once you do.
const THEME_STORE = 'bmwcd.theme';
const THEMES = [
  { id: 'auto',  glyph: '◐', label: 'Theme: follows your system' },
  { id: 'light', glyph: '☀', label: 'Theme: always light' },
  { id: 'dark',  glyph: '☾', label: 'Theme: always dark' },
];
const themeBtn = document.getElementById('theme');

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  if (t.id === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t.id;
  themeBtn.textContent = t.glyph;
  themeBtn.title = `${t.label} — click to change`;
  themeBtn.setAttribute('aria-label', t.label);
  // Keep the browser chrome in step with the page it frames.
  const dark = t.id === 'dark'
    || (t.id === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.remove();
  const meta = document.createElement('meta');
  meta.name = 'theme-color';
  meta.content = dark ? '#0f1115' : '#f5f6f8';
  document.head.appendChild(meta);
  // Leaflet caches nothing about our colours, but the route is repainted from
  // the ramps, which do not change -- only the surface under them does.
  map.invalidateSize();
}

let theme = 'auto';
try { theme = localStorage.getItem(THEME_STORE) || 'auto'; } catch { /* private mode */ }
applyTheme(theme);

themeBtn.addEventListener('click', () => {
  theme = THEMES[(THEMES.findIndex(t => t.id === theme) + 1) % THEMES.length].id;
  try { localStorage.setItem(THEME_STORE, theme); } catch { /* private mode */ }
  applyTheme(theme);
});
// Following the system means noticing when the system changes.
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (theme === 'auto') applyTheme('auto');
});

const liveDot = document.getElementById('live');
liveDot.hidden = !LIVE;

// A saved copy is indistinguishable from a working one until you notice the
// clock has not moved in an hour. Say so, and say where the live one is -- the
// demo has no live_url and so gets no banner.
const snapshotEl = document.getElementById('snapshot');
if (!LIVE && DATA?.live_url) {
  document.getElementById('snapshot-text').textContent =
    `Saved copy — frozen at ${DATA.generated ? fmtDateTime(new Date(DATA.generated)) : '—'}. `
    + 'It only changes when the exporter is run again.';
  const link = document.getElementById('snapshot-link');
  link.href = DATA.live_url;
  link.textContent = `Open the live map at ${DATA.live_url} →`;
  snapshotEl.hidden = false;
}

// Rendered synchronously. This used to sit behind two animation frames, which
// works right up until the page is opened in a background tab -- rAF callbacks
// do not run while a tab is hidden, so the whole page stayed blank until it was
// brought to the front. Only the map fit needs to wait for layout, and that is
// deferred on its own inside setFocus.
ingest(DATA);
if (LIVE) startLive();

// If the first layout happened while hidden, the map measured nothing. Re-fit
// once it is actually on screen.
document.addEventListener('visibilitychange', () => {
  // Only refit if the user has not framed the map themselves. A hidden document
  // performs no layout, so this exists to fix a map sized while the tab was
  // hidden -- but unconditionally it also threw away a deliberate pan and zoom
  // on every single tab return.
  if (document.visibilityState !== 'visible') return;
  if (userMovedMap) return;
  afterLayout(() => fitToVehicle(current));
});
</script>
</body>
</html>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --muted: #99a1b3; --tile: #1d212a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#dfe3ea; --text:#12151b; --muted:#5b6474; --tile:#f2f4f7; }
  }
  * { box-sizing: border-box; }
  /* Flex column rather than an absolutely-positioned bar of a fixed height. The
     bar's contents vary with how many cars there are and how many trips they
     made, and at 300px the controls alone could eat all of it -- leaving the
     dashboard 24px tall to show 1400px of tiles. */
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  #map { flex:1 1 auto; min-height:120px; background:var(--bg); }
  .leaflet-container { background: var(--bg); }

  #bar { flex:0 0 auto; max-height:55vh; overflow:hidden; background:var(--panel);
    border-top:1px solid var(--line); display:flex; flex-direction:column; }
  /* Natural height, capped -- not proportionally shrinkable. Left shrinkable,
     flex weighs the dashboard's ~1500px of tiles against these ~130px and
     squeezes the controls to a sliver while the dashboard keeps hundreds of
     pixels it does not need. Past the cap the controls scroll instead. */
  .controls { flex:0 0 auto; max-height:46vh; overflow-y:auto; padding:10px 16px 8px;
    display:flex; flex-direction:column; gap:7px; border-bottom:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #clock { font-variant-numeric:tabular-nums; font-weight:600; min-width:185px; }
  input[type=range] { flex:1; min-width:200px; accent-color:#3b82f6; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px;
    padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { filter:brightness(1.25); }
  button.on { background:#3b82f6; color:#fff; }
  .legend { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .sw { display:inline-block; width:22px; height:8px; border-radius:2px;
    vertical-align:middle; margin-right:5px; }
  .note { flex:0 0 auto; color:var(--muted); font-size:11.5px; padding:0 16px 6px; }

  /* One line that scrolls, however many cars or trips there are. Wrapping these
     instead would push the dashboard off the bottom of the window. */
  #vehicles { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin;
    padding-bottom:2px; }
  #vehicles > * { flex:0 0 auto; }
  #vehicles button { font-weight:600; }
  #vehicles button .sub { font-weight:400; opacity:.72; margin-left:7px;
    font-variant-numeric:tabular-nums; }
  /* Renamed here rather than in config: marked so a name that disagrees with
     what the rest of the tooling calls the car is not a silent mystery. */
  #vehicles button.renamed .name::after { content:'*'; opacity:.55; margin-left:2px; }
  /* A real input, swapped in for the button while editing. Nesting a
     contenteditable inside the <button> looks tidier and does not work: the
     button claims Enter as its own activation and the edit never commits. */
  input.rename { flex:0 0 auto; background:var(--bg); color:var(--text);
    border:1px solid #3b82f6; border-radius:6px; padding:6px 10px; font:inherit;
    font-weight:600; font-size:13px; min-width:90px; }

  /* The row's own caption. Outside the scroller, so it stays put when there are
     more cars than fit. */
  .vehrow { align-items:center; gap:10px; }
  .rowlabel { flex:0 0 auto; color:var(--muted); font-size:12px; }

  /* Date and trip pickers. Dropdowns rather than a row of buttons: a month of
     retention is dozens of trips, and that row was already scrolling sideways
     with one day's worth. */
  .pickers { gap:8px 14px; }
  /* Label and its dropdown wrap as one unit -- split, the caption ends up
     stranded at the end of the line above its own control. */
  .picker { display:inline-flex; align-items:center; gap:7px; min-width:0;
    flex:0 1 auto; }
  .pickers select { flex:0 1 auto; min-width:0; background:var(--tile);
    color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; font:inherit; font-size:13px; cursor:pointer; }
  .pickers select:disabled { opacity:.5; cursor:default; }
  .pickers label { cursor:pointer; }
  #focusnote { font-variant-numeric:tabular-nums; }

  /* Shown only when the page is served, not when it is opened off disk -- a
     "live" badge on a static snapshot would be a lie. */
  #live { margin-left:auto; display:inline-flex; align-items:center; gap:6px; }
  #live i { width:8px; height:8px; border-radius:50%; background:#22c55e;
    box-shadow:0 0 0 0 #22c55e99; }
  #live.stale i { background:var(--muted); box-shadow:none; }
  #live.pulse i { animation:livepulse 1.1s ease-out 2; }
  @keyframes livepulse {
    0%   { box-shadow:0 0 0 0 #22c55eaa; transform:scale(1); }
    60%  { box-shadow:0 0 0 7px #22c55e00; transform:scale(1.35); }
    100% { box-shadow:0 0 0 0 #22c55e00; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #live.pulse i { animation:none; }
  }

  #state { flex:1 1 auto; min-height:90px; overflow-y:auto; padding:10px 16px 14px; }
  .group { margin-bottom:12px; }
  .group h4 { margin:0 0 6px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); font-weight:600; }
  .tiles { display:grid; gap:7px; grid-template-columns:repeat(auto-fill, minmax(178px, 1fr)); }
  .tile { background:var(--tile); border-radius:7px; padding:7px 10px; min-width:0; }
  .tile .k { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .tile .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.stale .v { color:var(--muted); font-weight:400; }
  /* The handful you actually open the page for. */
  .tile.primary { background:linear-gradient(180deg,var(--tile),var(--tile));
    border:1px solid #3b82f655; box-shadow:inset 0 0 0 1px #3b82f61a; }
  .tile.primary .v { font-size:21px; letter-spacing:-.01em; }
  .tile.primary .k { color:#7aa2f7; }

  #hover { position:absolute; z-index:1000; pointer-events:none; display:none;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; min-width:190px; box-shadow:0 6px 22px rgba(0,0,0,.35);
    font-size:12.5px; }
  #hover .h { font-weight:600; margin-bottom:5px; font-variant-numeric:tabular-nums; }
  #hover dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  #hover dt { color:var(--muted); white-space:nowrap; }
  #hover dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  #hover .mode { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:5px; vertical-align:baseline; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hover"></div>
<div id="bar">
  <div class="controls">
    <div class="row vehrow">
      <span class="rowlabel">Vehicles</span>
      <span class="row" id="vehicles"></span>
    </div>
    <div class="row pickers">
      <span class="picker"><label class="rowlabel" for="datesel">Date</label>
        <select id="datesel"></select></span>
      <span class="picker"><label class="rowlabel" for="tripsel">Trip</label>
        <select id="tripsel"></select></span>
      <button id="clearfocus" hidden>Show all</button>
      <span class="rowlabel" id="focusnote"></span>
      <span id="live" class="rowlabel" hidden title="Watching for new data">
        <i></i>live</span>
    </div>
    <div class="row">
      <button id="play">▶︎ Play</button>
      <span id="clock">—</span>
      <input type="range" id="slider" min="0" max="0" value="0" step="1">
      <button id="end">Latest</button>
    </div>
    <div class="row legend" id="legend">
      <span data-mode="electric"><i class="sw" style="background:linear-gradient(90deg,#bfdbfe,#1d4ed8)"></i>electric</span>
      <span data-mode="petrol"><i class="sw" style="background:linear-gradient(90deg,#fecaca,#b91c1c)"></i>petrol</span>
      <span data-mode="regen"><i class="sw" style="background:linear-gradient(90deg,#bbf7d0,#15803d)"></i>recuperating</span>
      <span data-mode="unknown"><i class="sw" style="background:#6b7280"></i>unknown</span>
      <span><i class="sw" style="width:9px;height:9px;border-radius:50%;background:#8aa;border:1.5px solid #fff"></i>received fix</span>
    </div>
  </div>
  <div id="state"></div>
  <div class="note" id="notes"></div>
</div>

/* ---------- route colouring ---------- */
const RAMPS = {
  electric:['#bfdbfe','#1d4ed8'], petrol:['#fecaca','#b91c1c'], regen:['#bbf7d0','#15803d'],
  unknown:['#6b7280','#6b7280'], idle:['#6b7280','#6b7280'], start:['#6b7280','#6b7280'],
};
const mix = (a,b,t) => {
  const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const [ar,ag,ab]=p(a), [br,bg,bb]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return `#${c(ar,br)}${c(ag,bg)}${c(ab,bb)}`;
};
const colourFor = pt => {
  const [lo,hi] = RAMPS[pt.mode] || RAMPS.unknown;
  return mix(lo, hi, Math.max(0, Math.min(1, pt.intensity ?? 0)));
};

// these as a flat zero, so promoting them puts "Fuel in tank 0 l" and "Total
// range 0 km" next to a perfectly good electric range. They still appear under
// their own category further down -- demoted, not hidden.
const FUEL_ONLY = new Set([
  'vehicle.drivetrain.fuelSystem.level',
  'vehicle.drivetrain.fuelSystem.remainingFuel',
  'vehicle.drivetrain.lastRemainingRange',
]);
const priorityFor = v =>
  PRIORITY.map(([k]) => k).filter(k => v?.burns_fuel !== false || !FUEL_ONLY.has(k));
// The first few get the large treatment -- these are the ones anyone opening
// the page is actually looking for.
const PRIMARY_COUNT = 4;

// A bare "No" against "Status of charging flap" is technically true and tells
// you nothing. Say what the state is instead, taken from the predicate the key
// itself names.
const BOOL_WORDS = [
  [/isLocked$/i,            ['Unlocked', 'Locked']],
  [/isPermanentlyUnlocked$/i, ['Normal', 'Permanently unlocked']],
  [/isHospitalityActive$/i, ['Locks after charging', 'Stays unlocked']],
  [/isOpen$/i,              ['Closed', 'Open']],
  [/isActive$/i,            ['Inactive', 'Active']],
  [/isPlugged$/i,           ['Unplugged', 'Plugged in']],
  [/isMoving$/i,            ['Stationary', 'Moving']],
  [/isIgnitionOn$/i,        ['Off', 'On']],
  [/isRemoteEngineRunning$/i, ['Not running', 'Running']],
  [/Connected$/i,           ['Disconnected', 'Connected']],
  [/isOn$/i,                ['Off', 'On']],
];

// BMW's enums arrive unspaced and shouting.
const ENUM_WORDS = {
  CHARGINGACTIVE: 'Active', CHARGINGPAUSED: 'Paused',
  CHARGINGENDED: 'Finished', CHARGINGERROR: 'Error',
  NOCHARGING: 'Not charging', INITIALIZATION: 'Starting',
  NOT_CHARGING: 'Not charging', WAITING_FOR_CHARGING: 'Waiting',
  FINISHED_FULLY_CHARGED: 'Fully charged', FINISHED_NOT_FULL: 'Finished',
  CONNECTED: 'Connected', DISCONNECTED: 'Disconnected',
  SECURED: 'Locked', UNLOCKED: 'Unlocked', 'SELECTIVE-LOCKED': 'Partly locked',
  SELECTIVELOCKED: 'Partly locked', CLOSED: 'Closed', OPEN: 'Open',
  INTERMEDIATE: 'Partly open', OPEN_TILT: 'Tilted', INTERMEDIATE_TILT: 'Tilted',
  INVALID: '—', UNKNOWN: '—', AUTOMATIC: 'Automatic',
  // Plug and connector names the generic sentence-case mangles.
  AC_TYPE2PLUG: 'AC Type 2', AC_TYPE1PLUG: 'AC Type 1',
  DC_CCSPLUG: 'DC CCS', DC_CHADEMOPLUG: 'DC CHAdeMO',
  AC_HOUSEHOLDPLUG: 'AC household socket',
  CONDUCTIVE: 'Conductive', INDUCTIVE: 'Inductive',
};

// BMW ships display names and categories in its catalogue; prefer those over
// anything derived from the key path. The fallback only applies when the
// catalogue has not been fetched.
let LABELS = DATA?.labels || {};
const labelFor = key => SHORT_LABELS[key] || LABELS[key]?.n || key.split('.').filter(p => p !== 'vehicle')
  .slice(-2).join(' ')
  .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
  .replace(/\b\w/g, c => c.toUpperCase());
const groupFor = key => LABELS[key]?.c || GROUPS[key.split('.')[1]] || 'Other';
const describeFor = key => LABELS[key]?.d || key;
// Thin space every three digits, so a 56651 km odometer reads as 56 651. Done by
// hand rather than with toLocaleString, which would put a comma on one machine
// and a full stop on the next -- the same reason the dates below are built here.
const group = n => {
  const [whole, frac] = String(n).split('.');
  const sign = whole.startsWith('-') ? '-' : '';
  const digits = sign ? whole.slice(1) : whole;
  if (digits.length < 5) return String(n);
  return sign + digits.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (frac ? '.' + frac : '');
};
const fmt = (value, unit, key = '') => {
  if (typeof value === 'boolean') {
    const hit = BOOL_WORDS.find(([re]) => re.test(key));
    return hit ? hit[1][value ? 1 : 0] : (value ? 'Yes' : 'No');
  }
  if (typeof value === 'string') {
    const token = value.trim().toUpperCase();
    if (ENUM_WORDS[token]) return ENUM_WORDS[token];
    // Generic: drop the ASN_ wrapper, split words, sentence case.
    const words = value.replace(/^ASN_is/i, '').replace(/[_-]+/g, ' ').trim();
    return words.charAt(0).toUpperCase() + words.slice(1).toLowerCase();
  }
  if (typeof value === 'number') {
    // Tyre pressures come in kPa; bar is what anyone actually reads off a gauge.
    if (unit === 'kpa') return (value / 100).toFixed(1) + ' bar';
    const n = group(Number.isInteger(value) ? value : Math.round(value * 100) / 100);
    if (!unit || unit === '-') return String(n);
    // Symbols bind tight to the number; worded units keep their space.
    const symbol = { percent: '%', degrees: '°' }[unit];
    return symbol ? `${n}${symbol}` : `${n} ${unit}`;
  }
  return '—';
};

/* ---------- dates ---------- */
// YYYY/MM/DD throughout, rather than whatever the browser locale decides.
// Sortable, unambiguous, and the same on every machine that opens the page.
const pad = n => String(n).padStart(2, '0');
const fmtDate = d =>
  `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
const fmtDateTime = d =>
  `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- hover readout ---------- */
const hoverEl = document.getElementById('hover');

function stateAt(v, key, t) {
  const s = v.state?.[key];
  if (!s) return null;
  let hit = null;
  for (const row of s.v) { if (row[0] <= t) hit = row; else break; }
  return hit ? { value: hit[1], unit: s.u } : null;
}

function speedAt(v, pt, t) {
  // BMW does not transmit exact speed -- privacy restriction -- and on this car
  // even the bucketed range has never arrived. Prefer BMW's band when it exists,
  // otherwise fall back to what the positions themselves imply.
  const lo = stateAt(v, 'vehicle.vehicle.speedRange.lowerBound', t);
  const hi = stateAt(v, 'vehicle.vehicle.speedRange.upperBound', t);
  if (lo && hi) return `${lo.value}–${hi.value} km/h`;
  if (lo || hi) { const one = lo || hi; return `${one.value} km/h${lo ? '+' : ' or less'}`; }

  if (pt.speed_kmh != null) {
    // A floor, not a reading: the car drove at least the straight line, so its
    // average can only have been higher. Say so rather than implying precision.
    return `≥${pt.speed_kmh} km/h${pt.speed_rough ? ' (rough)' : ''}`;
  }
  return 'not reported';
}

function consumptionOf(pt) {
  // "~" where the odometer's whole-kilometre resolution dominates the answer.
  const a = pt.approx ? '~' : '';
  if (pt.kwh_per_100km != null) return `${a}${pt.kwh_per_100km} kWh/100km`;
  if (pt.l_per_100km != null) return `${a}${pt.l_per_100km} l/100km`;
  if (pt.fuel_pct_per_100km != null) return `${a}${pt.fuel_pct_per_100km} %/100km`;
  if (pt.kwh != null) return `${pt.kwh} kWh recovered`;
  return null;
}

function showHover(v, pt, e) {
  const t = pt.t;
  const rows = [];
  const push = (label, value) => { if (value != null && value !== '') rows.push([label, value]); };

  push('Speed', speedAt(v, pt, t));
  push('Consumption', consumptionOf(pt));

  const soc = stateAt(v, 'vehicle.drivetrain.batteryManagement.header', t);
  push('Charge', soc && fmt(soc.value, soc.unit, 'soc'));
  const fuel = stateAt(v, 'vehicle.drivetrain.fuelSystem.level', t);
  push('Fuel', fuel && fmt(fuel.value, fuel.unit, 'fuel'));
  const odo = stateAt(v, 'vehicle.vehicle.travelledDistance', t);
  push('Odometer', odo && fmt(odo.value, odo.unit, 'odo'));

  push('Segment', pt.km ? `${pt.km.toFixed(2)} km` : null);
  // How long since the previous fix, so a long line reads as either a fast
  // straight road or a gap in what BMW sent.
  if (pt.gap_s != null) {
    const g = pt.gap_s;
    push('Since last fix', g < 90 ? `${g}s` : `${Math.floor(g/60)}m ${g%60}s`);
  }
  push('Heading', pt.heading != null ? `${pt.heading}°` : null);
  push('Altitude', pt.alt != null ? `${pt.alt} m` : null);
  push('Fix', [pt.fix, pt.sats != null ? `${pt.sats} sats` : null].filter(Boolean).join(' · ') || null);

  // Built as nodes rather than concatenated markup: `rows` carries units and
  // enum values that originate from BMW's catalogue, not from us.
  hoverEl.replaceChildren();
  const when = document.createElement('div');
  when.className = 'h';
  when.textContent = fmtDateTime(new Date(t));
  const mode = document.createElement('div');
  mode.className = 'h';
  const swatch = document.createElement('span');
  swatch.className = 'mode';
  swatch.style.background = colourFor(pt);
  mode.append(swatch, document.createTextNode(pt.mode));
  const dl = document.createElement('dl');
  for (const [k, val] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = val;
    dl.append(dt, dd);
  }
  hoverEl.append(when, mode, dl);

  hoverEl.style.display = 'block';
  // Flip the box away from the pointer near the right/bottom edges so it never
  // runs off screen.
  const p = e.originalEvent;
  const w = hoverEl.offsetWidth, h = hoverEl.offsetHeight;
  const x = p.clientX + 14, y = p.clientY + 14;
  hoverEl.style.left = (x + w > window.innerWidth ? p.clientX - w - 14 : x) + 'px';
  hoverEl.style.top  = (y + h > window.innerHeight ? p.clientY - h - 14 : y) + 'px';
}

function hideHover() { hoverEl.style.display = 'none'; }

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:20,
}).addTo(map);

let vehicles = DATA?.vehicles || [];

// One layer group per car, built once and left off the map until its car is
// selected. Drawing every car at once made two routes in the same town read as
// one improbable journey, and there is no reason that gets better with five.
const layers = new Map();

function buildLayer(v) {
  const group = L.layerGroup();
  if (!v.points?.length) return group;

  for (let i = 1; i < v.points.length; i++) {
    const a = v.points[i-1], b = v.points[i];
    // Only join fixes the exporter judged a real, continuous movement. Skipping
    // the rest is the point: drawing across a feed gap or a post-tunnel jump
    // invents a road that was never travelled.
    if (!b.draw) continue;
    const line = L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {
      color: colourFor(b), weight:5, opacity:.9, lineCap:'round',
    });
    line.on('mousemove', e => showHover(v, b, e));
    line.on('mouseover', e => showHover(v, b, e));
    line.on('mouseout', hideHover);
    group.addLayer(line);
    b._line = line;
  }
  // A dot per received fix. Without these a 500 m straight road and an
  // 8-minute hole in the feed look identical, and BMW's cadence is uneven
  // enough that most long straight lines are the latter.
  for (const p of v.points) {
    const dot = L.circleMarker([p.lat, p.lon], {
      radius: 3.5, weight: 1.5, color: '#fff', opacity: .9,
      fillColor: colourFor(p), fillOpacity: 1,
    });
    dot.on('mousemove', e => showHover(v, p, e));
    dot.on('mouseover', e => showHover(v, p, e));
    dot.on('mouseout', hideHover);
    group.addLayer(dot);
    p._dot = dot;
  }

  const marker = L.marker([v.points[0].lat, v.points[0].lon], { title: v.label })
    .bindPopup(`${v.label} · ${v.vin}`);
  group.addLayer(marker);
  v._marker = marker;
  return group;
}

function buildAllLayers() {
  for (const group of layers.values()) map.removeLayer(group);
  layers.clear();
  for (const v of vehicles) layers.set(v.vin, buildLayer(v));
}

// Deferred to after layout: at script-execution time #map can still measure
// zero, and Leaflet then fits the bounds against nothing and lands on zoom 0 --
// the whole world, with the route an invisible speck. invalidateSize() once the
// geometry is real fixes it.
function fitToVehicle(v) {
  map.invalidateSize();
  // Only what is actually drawn: framing a single trip against the whole
  // month's bounds would leave it a speck in the corner.
  const all = v?.points || [];
  const points = all.filter(pointInFocus);
  if (!points.length) { map.setView([52.1, 5.1], 8); return; }
  if (points.length === 1) { map.setView([points[0].lat, points[0].lon], 14); return; }
  // 12%, not 25%: a quarter of the span on every side costs a whole zoom level
  // on a short map pane, which on a town-sized route is the difference between
  // reading the street names and not.
  map.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lon])).pad(0.12));
  if (map.getZoom() > 16) map.setZoom(15);
}

// The map pane is whatever the bar leaves it, and the bar's height moves with
// the selected car: a hybrid adds a petrol swatch to the legend and a second
// trip button, which is enough to wrap a row and steal ~30px from the map.
// Leaflet does not watch its container, so without this the pane grows and the
// bottom strip stays an unpainted black band until the next pan.
// Run once the browser has laid the page out. requestAnimationFrame is the
// right signal when the tab is visible and never fires when it is not, so a
// hidden tab falls back to a task instead of waiting indefinitely.
function afterLayout(fn) {
  if (document.visibilityState === 'hidden') setTimeout(fn, 0);
  else requestAnimationFrame(() => requestAnimationFrame(fn));
}

const mapEl = document.getElementById('map');
if (window.ResizeObserver) {
  // Inside a frame: calling invalidateSize synchronously from the callback
  // makes browsers complain about an undelivered-notification loop.
  new ResizeObserver(() => requestAnimationFrame(() => map.invalidateSize()))
    .observe(mapEl);
}
window.addEventListener('resize', () => map.invalidateSize());

/* ---------- timeline ---------- */
// Per vehicle, not shared. One axis across all cars means the slider is scaled
// to whichever has the longest history: with 36 fixes over eleven hours on one
// car and 2 fixes over two minutes on another, the whole of the second car sits
// in the last pixel of the track and scrubbing it is impossible.
//
// State changes count as events too, so a car that has never reported a GPS fix
// still gets a scrubbable history.
// Narrowed by the date/trip pickers when either is set, so the slider spans
// exactly what is drawn rather than the car's whole history.
function timesFor(v) {
  let times = [...new Set([
    ...(v?.points || []).map(p => p.t),
    ...Object.values(v?.state || {}).flatMap(s => s.v.map(([t]) => t)),
  ])].sort((a, b) => a - b);

  if (focus.trip != null) {
    const t = (v?.trips || []).find(x => x.trip === focus.trip);
    // Keep the state changes that fall inside the drive, so the dashboard still
    // moves while scrubbing a single trip.
    if (t) times = times.filter(x => x >= t.start && x <= t.end);
  } else if (focus.date) {
    times = times.filter(x => fmtDate(new Date(x)) === focus.date);
  }
  return times;
}

let allTimes = [];
const slider = document.getElementById('slider');
const clock  = document.getElementById('clock');

const lastAtOrBefore = (arr, t, key = x => x.t) => {
  let found = null;
  for (const item of arr) { if (key(item) <= t) found = item; else break; }
  return found;
};

/* ---------- state panel ---------- */
let current = vehicles[0];
const stateEl = document.getElementById('state');
const tiles = new Map();

function buildPanel(v) {
  stateEl.innerHTML = '';
  tiles.clear();
  if (!v || !v.state || !Object.keys(v.state).length) {
    stateEl.innerHTML = '<div class="note">No telemetry recorded for this vehicle yet.</div>';
    return;
  }
  const priority = priorityFor(v);
  const keys = Object.keys(v.state);
  const ordered = [
    ...priority.filter(k => keys.includes(k)),
    ...keys.filter(k => !priority.includes(k)).sort(),
  ];
  const byGroup = new Map([['Key readings', []]]);
  for (const k of ordered) {
    const g = priority.includes(k) ? 'Key readings' : groupFor(k);
    if (!byGroup.has(g)) byGroup.set(g, []);
    byGroup.get(g).push(k);
  }
  for (const [group, groupKeys] of byGroup) {
    if (!groupKeys.length) continue;
    const wrap = document.createElement('div');
    wrap.className = 'group';
    wrap.innerHTML = `<h4>${group}</h4>`;
    const grid = document.createElement('div');
    grid.className = 'tiles';
    for (const k of groupKeys) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (priority.indexOf(k) > -1
        && priority.indexOf(k) < PRIMARY_COUNT ? ' primary' : '');
      tile.title = `${describeFor(k)}\n\n${k}`;
      // textContent, not innerHTML: these labels come verbatim from BMW's
      // public catalogue API and this page is published to GitHub Pages.
      const kEl = document.createElement('div');
      kEl.className = 'k';
      kEl.textContent = labelFor(k);
      const vEl = document.createElement('div');
      vEl.className = 'v';
      vEl.textContent = '—';
      tile.append(kEl, vEl);
      grid.appendChild(tile);
      tiles.set(k, tile);
    }
    wrap.appendChild(grid);
    stateEl.appendChild(wrap);
  }
}

function paintPanel(v, t) {
  if (!v?.state) return;
  for (const [key, tile] of tiles) {
    const series = v.state[key];
    const hit = series && lastAtOrBefore(series.v, t, x => x[0]);
    const valueEl = tile.querySelector('.v');
    valueEl.textContent = hit ? fmt(hit[1], series.u, key) : '—';
    // Grey out anything not yet reported at this point on the timeline.
    tile.classList.toggle('stale', !hit);
  }
}

/* ---------- apply ---------- */
// Only the selected car: the others are not on the map, and painting their
// geometry would be work nobody can see.
function apply(idx) {
  const t = allTimes[idx] ?? allTimes[allTimes.length - 1];
  clock.textContent = t ? fmtDateTime(new Date(t)) : '—';
  const v = current;
  if (v?._marker) {
    const p = lastAtOrBefore(v.points, t);
    if (p) { v._marker.setLatLng([p.lat, p.lon]); v._marker.setOpacity(1); }
    else v._marker.setOpacity(.25);
  }
  for (const p of v?.points || []) {
    const past = p.t <= t;
    if (p._line) p._line.setStyle({ opacity: past ? .9 : .12 });
    if (p._dot) p._dot.setStyle({ opacity: past ? .9 : .1, fillOpacity: past ? 1 : .1 });
  }
  paintPanel(v, t);
}

slider.addEventListener('input', () => apply(+slider.value));
document.getElementById('end').addEventListener('click', () => {
  slider.value = slider.max; apply(+slider.max);
});

let timer = null;
const play = document.getElementById('play');
play.addEventListener('click', () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = '▶︎ Play'; play.classList.remove('on'); return; }
  play.textContent = '❚❚ Pause'; play.classList.add('on');
  timer = setInterval(() => {
    let next = +slider.value + 1;
    if (next > +slider.max) next = 0;
    slider.value = next; apply(next);
  }, 220);
});

/* ---------- vehicle switcher ---------- */
// Built from whatever is in the data. Cars are discovered from the telemetry
// itself, so a new one appears here the first time it streams anything -- no
// list to maintain, and nothing here assumes there are exactly two.
const vehiclesEl = document.getElementById('vehicles');
const legendEl = document.getElementById('legend');
const notesEl = document.getElementById('notes');
const buttons = new Map();

function selectVehicle(v) {
  if (!v) return;
  const previous = current;
  current = v;

  // Map: swap which car is drawn, then frame it.
  if (previous && previous !== v) map.removeLayer(layers.get(previous.vin));
  const group = layers.get(v.vin);
  if (group && !map.hasLayer(group)) group.addTo(map);
  hideHover();

  for (const [vin, button] of buttons) button.classList.toggle('on', vin === v.vin);
  // With enough cars the row scrolls, and the one that opens by default can be
  // off the right-hand end -- looking, from the visible buttons alone, as though
  // nothing is selected at all.
  buttons.get(v.vin)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

  // A petrol swatch on a car that has never burnt a drop is just noise.
  for (const item of legendEl.querySelectorAll('[data-mode="petrol"]')) {
    item.style.display = v.burns_fuel === false ? 'none' : '';
  }

  buildPanel(v);
  showNotes(v);

  // Each car has its own dates and trips, so a filter from the previous one
  // means nothing here. setFocus does the rest: geometry, timeline, and the
  // deferred fit.
  focus = { date: null, trip: null };
  buildDatePicker(v);
  setFocus({});
}

function showNotes(v) {
  const parts = [...(v?.notes || []), ...(DATA?.notes || [])];
  if (!vehicles.length) parts.unshift('No telemetry recorded yet.');
  const renamed = v && overrideFor(v);
  if (renamed) {
    parts.unshift(
      `“${renamed.name}” is this browser's name for it; everything else still ` +
      `calls it “${renamed.base}”`
    );
  }
  parts.push(`generated ${DATA?.generated ? fmtDateTime(new Date(DATA.generated)) : '—'}`);
  notesEl.textContent = parts.join('  ·  ');
}

/* ---------- names ---------- */
// A page opened over file:// cannot write config.toml, so a name typed here is
// kept in this browser instead. config.toml stays the real store -- the menu bar
// writes it, the exporter and CLI read it -- and this is a quick override on top
// for relabelling without leaving the map.
const NAME_STORE = 'bmwcd.vehicleNames';
const MAX_NAME = 40;

function readOverrides() {
  try { return JSON.parse(localStorage.getItem(NAME_STORE)) || {}; }
  catch { return {}; }  // private mode, or a browser that walls off file://
}
const overrides = readOverrides();

function saveOverrides() {
  try { localStorage.setItem(NAME_STORE, JSON.stringify(overrides)); return true; }
  catch { return false; }
}

// Each override remembers the label it replaced. If config.toml later names the
// car something else, that is a deliberate act and wins -- otherwise a name
// typed here once would quietly outrank every config change that followed it.
const exportedLabel = v => v.label || v.vin.slice(-6);
const overrideFor = v => {
  const o = overrides[v.vin];
  return o && o.base === exportedLabel(v) ? o : null;
};
const labelOf = v => overrideFor(v)?.name || exportedLabel(v);

// Drop overrides that have been outranked, and ones for cars no longer in the
// data. Left alone they are harmless but permanent: ignored on every read, and
// still sitting there years later.
function pruneOverrides() {
  const live = new Set(vehicles.map(v => v.vin));
  let pruned = false;
  for (const [vin, o] of Object.entries(overrides)) {
    const v = vehicles.find(x => x.vin === vin);
    if (!live.has(vin) || o?.base !== exportedLabel(v)) {
      delete overrides[vin];
      pruned = true;
    }
  }
  if (pruned) saveOverrides();
}

function paintButton(v) {
  const button = buttons.get(v.vin);
  if (!button) return;
  const fixes = (v.points || []).length;
  button.querySelector('.name').textContent = labelOf(v);
  button.querySelector('.sub').textContent =
    `${fixes} fix${fixes === 1 ? '' : 'es'} · ${Object.keys(v.state || {}).length} keys`;
  button.classList.toggle('renamed', !!overrideFor(v));
  button.title = overrideFor(v)
    ? `${v.vin}\nRenamed in this browser; config.toml still calls it ` +
      `"${exportedLabel(v)}".\nDouble-click to change, or clear it to go back.`
    : `${v.vin}\nDouble-click to rename.`;
  if (v._marker) v._marker.setPopupContent(`${labelOf(v)} · ${v.vin}`);
}

function beginRename(v) {
  const button = buttons.get(v.vin);
  if (!button || !button.isConnected) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename';
  input.value = labelOf(v);
  input.maxLength = MAX_NAME;
  input.title = `Naming ${v.vin}\nEnter saves, Escape cancels, empty resets.`;
  button.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const typed = input.value;
    input.replaceWith(button);

    if (commit) {
      const name = typed.replace(/\s+/g, ' ').trim().slice(0, MAX_NAME);
      // Emptying it, or typing back exactly what config already says, clears the
      // override rather than storing a redundant copy of it.
      if (!name || name === exportedLabel(v)) delete overrides[v.vin];
      else overrides[v.vin] = { name, base: exportedLabel(v) };
      var stored = saveOverrides();
    }
    paintButton(v);
    if (v === current) showNotes(v);
    if (commit && !stored) {
      notesEl.textContent =
        'Renamed for this session only — this browser would not store it. ' +
        'Use “Rename vehicle” in the menu bar to make it stick.';
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function buildSwitcher() {
  buttons.clear();
  vehiclesEl.replaceChildren();
  for (const v of vehicles) {
    const button = document.createElement('button');
    const name = document.createElement('span');
    name.className = 'name';
    const sub = document.createElement('span');
    sub.className = 'sub';
    button.append(name, sub);
    button.addEventListener('click', () => selectVehicle(v));
    button.addEventListener('dblclick', e => { e.preventDefault(); beginRename(v); });
    buttons.set(v.vin, button);
    vehiclesEl.appendChild(button);
    paintButton(v);
  }
  // With one car there is nothing to switch between, but it can still be
  // renamed, so the row stays.
  document.querySelector('.vehrow').style.display = vehicles.length ? '' : 'none';
}

/* ---------- date and trip pickers ---------- */
// Position updates stop entirely while parked, so a day's fixes are several
// separate drives rather than one route, and a month of retention is dozens of
// them across dozens of days. Two dropdowns rather than a row of buttons: the
// button row was already scrolling sideways with a single day on it.

const dateSel = document.getElementById('datesel');
const tripSel = document.getElementById('tripsel');
const clearFocusBtn = document.getElementById('clearfocus');
const focusNote = document.getElementById('focusnote');

// What the page is narrowed to. Both null means the whole history of the
// selected car; a trip always implies its own date.
let focus = { date: null, trip: null };

function dayOf(t) { return fmtDate(new Date(t)); }

// Trips are the ones that actually covered ground. A "trip" of 0 km is a burst
// of parked fixes that the exporter kept as its own group, and offering it here
// would be offering something with nothing to show.
const drivenTrips = v => (v?.trips || []).filter(t => t.km > 0);

function daysFor(v) {
  const days = new Map();
  const touch = day => days.get(day) ||
    (days.set(day, { fixes: 0, trips: new Set(), km: 0 }), days.get(day));

  for (const p of v?.points || []) {
    const e = touch(dayOf(p.t));
    e.fixes++;
    e.km += p.km || 0;
  }
  for (const t of drivenTrips(v)) touch(dayOf(t.start)).trips.add(t.trip);
  // Days with no fix at all but some state change -- a parked car reporting a
  // charge finishing is still a day with something on it.
  for (const s of Object.values(v?.state || {})) {
    for (const [t] of s.v) touch(dayOf(t));
  }
  return [...days.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));  // newest first
}

function tripSummary(t) {
  const parts = [`${t.km} km`, `${t.minutes}m`];
  if (t.avg_kmh != null) parts.push(`${t.avg_kmh} km/h incl. stops`);
  const a = t.approx ? '~' : '';
  if (t.kwh_per_100km != null) parts.push(`${a}${t.kwh_per_100km} kWh/100km`);
  if (t.l_per_100km != null) parts.push(`${a}${t.l_per_100km} l/100km`);
  if (t.fuel_pct_per_100km != null) parts.push(`${a}${t.fuel_pct_per_100km} %/100km`);
  return parts.join(' · ');
}

function option(value, text) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  return o;
}

function buildDatePicker(v) {
  const days = daysFor(v);
  dateSel.replaceChildren(option('', `All dates (${days.length})`));
  for (const [day, e] of days) {
    const bits = [];
    if (e.trips.size) bits.push(`${e.trips.size} trip${e.trips.size > 1 ? 's' : ''}`);
    if (e.fixes) bits.push(`${e.fixes} fix${e.fixes === 1 ? '' : 'es'}`);
    if (!bits.length) bits.push('state only');
    dateSel.appendChild(option(day, `${day} — ${bits.join(', ')}`));
  }
  dateSel.value = focus.date || '';
  dateSel.disabled = !days.length;
}

function buildTripPicker(v) {
  // Trips on the chosen day, or every trip when no day is chosen.
  const trips = drivenTrips(v)
    .filter(t => !focus.date || dayOf(t.start) === focus.date)
    .sort((a, b) => a.start - b.start);
  tripSel.replaceChildren(option('', trips.length
    ? `All trips (${trips.length})`
    : 'No trips with distance'));
  // Without a date filter the list can span days, and a bare "10:54" then does
  // not say which one. Only worth the extra width when it is actually ambiguous.
  const spansDays = new Set(trips.map(t => dayOf(t.start))).size > 1;
  for (const t of trips) {
    const when = spansDays
      ? `${dayOf(t.start).slice(5)} ${fmtTime(new Date(t.start))}`
      : fmtTime(new Date(t.start));
    tripSel.appendChild(option(
      String(t.trip),
      `${when} · ${t.km} km · ${t.minutes}m`,
    ));
  }
  // A trip selected on another day cannot survive the date changing under it.
  if (focus.trip != null && !trips.some(t => t.trip === focus.trip)) focus.trip = null;
  tripSel.value = focus.trip == null ? '' : String(focus.trip);
  tripSel.disabled = !trips.length;
}

function tripById(v, id) { return (v?.trips || []).find(t => t.trip === id); }

// What is on screen right now, in one line.
function describeFocus(v) {
  if (focus.trip != null) {
    const t = tripById(v, focus.trip);
    return t ? `${fmtDate(new Date(t.start))} ${fmtTime(new Date(t.start))} — ${tripSummary(t)}`
             : '';
  }
  const trips = drivenTrips(v).filter(t => !focus.date || dayOf(t.start) === focus.date);
  if (!trips.length) return focus.date ? 'no trips with distance on this date' : '';
  const km = Math.round(trips.reduce((sum, t) => sum + t.km, 0) * 10) / 10;
  return `${trips.length} trip${trips.length > 1 ? 's' : ''} · ${km} km total`;
}

function pointInFocus(p) {
  if (focus.trip != null) return p.trip === focus.trip;
  if (focus.date) return dayOf(p.t) === focus.date;
  return true;
}

// Layers are added and removed rather than faded to transparent: an invisible
// polyline still answers the mouse, and a tooltip rising out of blank map for a
// drive you have filtered away is worse than not filtering at all.
function applyFocusToGeometry(v) {
  const group = layers.get(v?.vin);
  if (!group) return;
  for (const p of v.points || []) {
    const want = pointInFocus(p);
    for (const layer of [p._line, p._dot]) {
      if (!layer) continue;
      if (want && !group.hasLayer(layer)) group.addLayer(layer);
      else if (!want && group.hasLayer(layer)) group.removeLayer(layer);
    }
  }
}

function setFocus(next, { rebuildTrips = true } = {}) {
  focus = { ...focus, ...next };
  const v = current;
  if (rebuildTrips) buildTripPicker(v);
  dateSel.value = focus.date || '';
  tripSel.value = focus.trip == null ? '' : String(focus.trip);

  applyFocusToGeometry(v);
  allTimes = timesFor(v);
  slider.max = Math.max(0, allTimes.length - 1);
  slider.value = slider.max;
  slider.disabled = allTimes.length < 2;

  clearFocusBtn.hidden = !focus.date && focus.trip == null;
  focusNote.textContent = describeFocus(v);
  hideHover();
  apply(+slider.value);
  afterLayout(() => fitToVehicle(v));
}

dateSel.addEventListener('change', () => setFocus({ date: dateSel.value || null }));
tripSel.addEventListener('change', () => {
  const id = tripSel.value === '' ? null : Number(tripSel.value);
  // Picking a trip from "All dates" pins the date too, so the two controls
  // never disagree about what is on screen.
  const t = id == null ? null : tripById(current, id);
  setFocus({ trip: id, date: t ? dayOf(t.start) : focus.date }, { rebuildTrips: !!t });
});
clearFocusBtn.addEventListener('click', () => setFocus({ date: null, trip: null }));

/* ---------- loading, and reloading ---------- */

// Whichever car has said something most recently -- that is the one you came to
// look at.
function mostRecentVehicle() {
  const stamp = v => Math.max(
    ...(v.points || []).map(p => p.t),
    ...Object.values(v.state || {}).flatMap(s => s.v.map(([t]) => t)),
    0,
  );
  return vehicles.slice().sort((a, b) => stamp(b) - stamp(a))[0];
}

// Swap in a payload and rebuild everything derived from it. Used for the first
// render and for every live update, so there is one code path rather than two
// that drift apart.
function ingest(payload, { keep = null } = {}) {
  DATA = payload;
  LABELS = payload?.labels || {};
  vehicles = payload?.vehicles || [];

  pruneOverrides();
  buildAllLayers();
  buildSwitcher();

  const target = (keep && vehicles.find(v => v.vin === keep.vin)) || mostRecentVehicle();
  current = target || null;
  showNotes(current);
  if (!current) return;

  selectVehicle(current);
  if (!keep) return;

  // Put the view back where the user had it. selectVehicle resets the filter,
  // which is right when *they* switch cars and wrong when the page reloaded
  // itself underneath them.
  const days = new Set([...dateSel.options].map(o => o.value));
  const date = days.has(keep.date) ? keep.date : null;
  const trip = keep.trip != null && tripById(current, keep.trip) ? keep.trip : null;
  if (date || trip != null) setFocus({ date, trip });

  // Scrubbed to a moment: hold that moment. Parked at the end: follow the end,
  // which is the whole point of leaving the page open.
  if (!keep.atLatest && keep.t != null) {
    const idx = allTimes.findIndex(x => x >= keep.t);
    slider.value = idx < 0 ? slider.max : idx;
    apply(+slider.value);
  }
  if (keep.view) map.setView(keep.view.center, keep.view.zoom, { animate: false });
}

/* ---------- live updates ---------- */
// Only when the page is served over http. Opened straight off disk it cannot
// fetch anything -- a file:// origin is opaque -- so it stays the static
// snapshot it has always been.
const LIVE = location.protocol === 'http:' || location.protocol === 'https:';
const POLL_MS = 15000;

async function pollOnce(state) {
  const stamp = await (await fetch('stamp.json', { cache: 'no-store' })).json();
  const key = `${stamp.latest}|${stamp.rows}`;
  if (key === state.key) return;
  const first = state.key === null;
  state.key = key;
  if (first) return;  // the first poll only establishes the baseline

  const payload = await (await fetch('data.json', { cache: 'no-store' })).json();
  // Capture where the user is before pulling the rug out.
  ingest(payload, {
    keep: {
      vin: current?.vin,
      date: focus.date,
      trip: focus.trip,
      atLatest: +slider.value === +slider.max,
      t: allTimes[+slider.value],
      // Only if they have moved the map themselves; otherwise let the new data
      // reframe it, so a drive in progress stays in view as it extends.
      view: state.userMoved ? { center: map.getCenter(), zoom: map.getZoom() } : null,
    },
  });
  flashLive();
}

function flashLive() {
  liveDot.classList.remove('pulse');
  void liveDot.offsetWidth;  // restart the animation rather than ignore it
  liveDot.classList.add('pulse');
  liveDot.title = `Updated ${fmtDateTime(new Date())}`;
}

function startLive() {
  const state = { key: null, userMoved: false };
  // Only genuine user gestures pin the view across an update. Listening to
  // Leaflet's move/zoom events instead would fire on our own fitBounds, so the
  // view would count as "user-controlled" from the first render onwards and a
  // drive in progress would never stay framed.
  const mark = () => { state.userMoved = true; };
  map.on('dragend', mark);
  mapEl.addEventListener('wheel', mark, { passive: true });
  mapEl.addEventListener('dblclick', mark);
  mapEl.addEventListener('click', e => {
    if (e.target.closest('.leaflet-control-zoom')) mark();
  });

  // .then before .catch, not after: a catch handler returns a resolved promise,
  // so a trailing .then runs on the failure path too and would clear the very
  // class the catch just set.
  const tick = () => pollOnce(state)
    .then(() => liveDot.classList.remove('stale'))
    // The server is gone (menu bar quit, laptop asleep). Keep trying quietly --
    // it comes back, and a page full of error text helps nobody.
    .catch(() => liveDot.classList.add('stale'));

  tick();
  setInterval(tick, POLL_MS);
  // Catch up immediately on waking rather than waiting out the interval.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') tick();
  });
}

const liveDot = document.getElementById('live');
liveDot.hidden = !LIVE;

// Rendered synchronously. This used to sit behind two animation frames, which
// works right up until the page is opened in a background tab -- rAF callbacks
// do not run while a tab is hidden, so the whole page stayed blank until it was
// brought to the front. Only the map fit needs to wait for layout, and that is
// deferred on its own inside setFocus.
ingest(DATA);
if (LIVE) startLive();

// If the first layout happened while hidden, the map measured nothing. Re-fit
// once it is actually on screen.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') afterLayout(() => fitToVehicle(current));
});
</script>
</body>
</html>

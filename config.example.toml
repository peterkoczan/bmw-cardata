# Copy to config.toml and fill in. config.toml is gitignored.

# From My BMW portal -> Personal Data -> My Vehicles -> CarData -> "Create Client ID"
client_id = "00000000-0000-0000-0000-000000000000"

# Your vehicles. Listed for `status` output only -- the subscription is a single
# wildcard topic ({gcid}/+) covering every VIN on the account, so a car added in
# the portal starts streaming without editing this.
vins = [
    "WBAXXXXXXXXXXXXXX",
    "WBYXXXXXXXXXXXXXX",
]
# To label these something friendlier than a VIN tail on the map, see [names]
# at the bottom of this file.

# Optional cross-check against the GCID shown in the portal under
# CARDATA STREAM -> Show Connection Details -> USERNAME.
# The token response carries the authoritative value; if this is set and
# disagrees, we abort rather than silently stream under the wrong identity.
# gcid = ""

# Where raw JSONL, logs, the catalogue cache and the rendered map land.
# Relative paths resolve against the project root.
data_dir = "data"

# Postgres. Local socket, no password.
dsn = "postgresql:///bmwcardata"

# Retention, applied by `bmwcd prune` (daily at 04:00 via the launchd agent).
# The database holds this many days...
retention_days = 30
# ...and the raw JSONL keeps twice that by default, so the database can be
# dropped and rebuilt with `bmwcd load` if the schema changes.
# raw_retention_days = 60

# Logs rotate on size rather than age, because they grow with how much you drive
# rather than with the calendar. Checked by the running stream every 30s, and
# again by the nightly prune in case it is not running.
log_max_mb = 10
log_keep = 3

# How much history the live map carries by default. ?days=0 fetches everything.
map_days = 7

# Index cost relative to a sequential read. 4.0 is Postgres's spinning-disk
# default; ~1.1 is right for an SSD and is what lets the planner use the index.
random_page_cost = 1.1

# What to call each car on the map's vehicle switcher. BMW streams no model name
# anywhere in the 245 attributes, so without this a car can only be labelled by
# the tail of its VIN. Any VIN left out falls back to that.
#
# Keep this last: everything below a TOML table header belongs to that table.
[names]
# "WBAXXXXXXXXXXXXXX" = "X5"
# "WBYXXXXXXXXXXXXXX" = "i3"
